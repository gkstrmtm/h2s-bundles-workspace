<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>404 | Home2Smart</title>
    <link rel="icon" href="https://cdn.jsdelivr.net/gh/gkstrmtm/home2smart-assets@main/logo-180.png" />
    <style>
      :root { color-scheme: dark; --blue: #1498ff; --ice: #dff4ff; --navy: #07121f; --muted: #8ea2b5; }
      * { box-sizing: border-box; }
      html, body { min-height: 100%; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        padding: 24px;
        color: white;
        background:
          radial-gradient(circle at 50% 42%, rgba(20, 152, 255, 0.13), transparent 30rem),
          var(--navy);
        font-family: Arial, Helvetica, sans-serif;
      }
      body::before {
        content: "";
        position: fixed;
        inset: -20%;
        pointer-events: none;
        opacity: 0.26;
        background-image:
          linear-gradient(rgba(117, 187, 239, 0.08) 1px, transparent 1px),
          linear-gradient(90deg, rgba(117, 187, 239, 0.08) 1px, transparent 1px);
        background-size: 42px 42px;
        mask-image: radial-gradient(circle at center, black, transparent 64%);
        animation: grid-drift 18s linear infinite;
      }
      main { position: relative; z-index: 1; width: min(100%, 560px); text-align: center; }
      .mark {
        position: relative;
        width: min(72vw, 290px);
        aspect-ratio: 1;
        display: grid;
        place-items: center;
        margin: 0 auto 34px;
        isolation: isolate;
      }
      .halo {
        position: absolute;
        inset: 19%;
        border-radius: 50%;
        background: rgba(20, 152, 255, 0.18);
        filter: blur(28px);
        animation: halo-in 1.1s 160ms cubic-bezier(.16, 1, .3, 1) both;
      }
      .orbit {
        position: absolute;
        inset: 4%;
        border-radius: 50%;
        background: conic-gradient(from 20deg, transparent 0 13%, rgba(71, 180, 255, 0.8) 13% 18%, transparent 18% 54%, rgba(71, 180, 255, 0.28) 54% 68%, transparent 68%);
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 1px), #000 0);
        mask: radial-gradient(farthest-side, transparent calc(100% - 1px), #000 0);
        animation: orbit-cw 12s linear infinite, orbit-in 900ms cubic-bezier(.16, 1, .3, 1) both;
      }
      .orbit.two {
        inset: 13%;
        opacity: 0.62;
        background: conic-gradient(from 210deg, transparent 0 25%, var(--ice) 25% 28%, transparent 28% 72%, rgba(20, 152, 255, 0.75) 72% 82%, transparent 82%);
        animation: orbit-ccw 8s linear infinite, orbit-in 1s 90ms cubic-bezier(.16, 1, .3, 1) both;
      }
      .frame {
        position: absolute;
        inset: 21%;
        border: 1px solid rgba(166, 222, 255, 0.2);
        border-radius: 28%;
        transform: rotate(45deg);
        animation: frame-in 1s 140ms cubic-bezier(.16, 1, .3, 1) both;
      }
      .logo-shell {
        position: relative;
        width: 44%;
        aspect-ratio: 1;
        display: grid;
        place-items: center;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.85);
        border-radius: 30px;
        background: rgba(255, 255, 255, 0.98);
        box-shadow: 0 0 0 9px rgba(20, 152, 255, 0.06), 0 24px 70px rgba(20, 152, 255, 0.3);
        animation: logo-in 900ms 220ms cubic-bezier(.16, 1, .3, 1) both;
      }
      .logo-shell::after {
        content: "";
        position: absolute;
        inset: -45% -75%;
        background: linear-gradient(105deg, transparent 42%, rgba(20, 152, 255, 0.18) 49%, rgba(255, 255, 255, 0.9) 50%, transparent 58%);
        transform: translateX(-55%);
        animation: scan 1.2s 850ms cubic-bezier(.65, 0, .35, 1) both;
      }
      .logo { width: 70%; height: 70%; object-fit: contain; }
      .copy { animation: copy-in 750ms 600ms cubic-bezier(.16, 1, .3, 1) both; }
      h1 { margin: 0; font-size: clamp(42px, 10vw, 68px); line-height: .95; letter-spacing: -0.055em; }
      p { margin: 12px 0 30px; color: var(--muted); font-size: 15px; letter-spacing: 0.04em; }
      a {
        min-height: 48px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 12px 22px;
        border: 1px solid rgba(151, 216, 255, 0.32);
        border-radius: 999px;
        color: white;
        background: rgba(20, 152, 255, 0.1);
        font-size: 14px;
        font-weight: 700;
        text-decoration: none;
        transition: transform 180ms ease, background 180ms ease, border-color 180ms ease;
      }
      a::after { content: "→"; color: var(--blue); font-size: 17px; transition: transform 180ms ease; }
      a:hover { transform: translateY(-2px); border-color: rgba(151, 216, 255, 0.7); background: rgba(20, 152, 255, 0.18); }
      a:hover::after { transform: translateX(3px); }
      a:focus-visible { outline: 3px solid rgba(20, 152, 255, 0.45); outline-offset: 4px; }
      @keyframes grid-drift { to { transform: translate3d(42px, 42px, 0); } }
      @keyframes orbit-cw { to { transform: rotate(360deg); } }
      @keyframes orbit-ccw { to { transform: rotate(-360deg); } }
      @keyframes orbit-in { from { opacity: 0; scale: .72; } }
      @keyframes halo-in { from { opacity: 0; transform: scale(.45); } }
      @keyframes frame-in { from { opacity: 0; transform: rotate(25deg) scale(.7); } }
      @keyframes logo-in { from { opacity: 0; transform: scale(.68) rotate(-5deg); } }
      @keyframes scan { from { transform: translateX(-55%); } to { transform: translateX(55%); } }
      @keyframes copy-in { from { opacity: 0; transform: translateY(16px); } }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">
        <div class="halo"></div>
        <div class="orbit"></div>
        <div class="orbit two"></div>
        <div class="frame"></div>
        <div class="logo-shell">
          <img class="logo" src="https://cdn.jsdelivr.net/gh/gkstrmtm/home2smart-assets@main/logo-180.png" alt="" />
        </div>
      </div>
      <div class="copy">
        <h1>404</h1>
        <p>Page not found.</p>
        <a href="/">Back home</a>
      </div>
    </main>
  </body>
</html>
