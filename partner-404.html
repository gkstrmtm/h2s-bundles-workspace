<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>404 | Home2Smart</title>
    <link rel="icon" href="https://cdn.jsdelivr.net/gh/gkstrmtm/home2smart-assets@main/logo-180.png" />
    <style>
      :root { color-scheme: light; --blue: #087eea; --navy: #10243a; --muted: #667788; --paper: #f7fafc; }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        color: var(--navy);
        background: var(--paper);
        font-family: Arial, Helvetica, sans-serif;
      }
      main { width: min(100%, 520px); text-align: center; }
      .logo-stage {
        position: relative;
        width: 190px;
        height: 190px;
        display: grid;
        place-items: center;
        margin: 0 auto 30px;
      }
      .logo-stage::before,
      .logo-stage::after {
        content: "";
        position: absolute;
        inset: 8px;
        border: 1px solid rgba(8, 126, 234, 0.2);
        border-radius: 50%;
        animation: ripple 3.2s ease-out infinite;
      }
      .logo-stage::after { animation-delay: 1.6s; }
      .logo {
        position: relative;
        z-index: 1;
        width: 118px;
        height: 118px;
        object-fit: contain;
        filter: drop-shadow(0 16px 24px rgba(8, 126, 234, 0.2));
        animation: float 3.6s ease-in-out infinite;
      }
      h1 { margin: 0; font-size: clamp(34px, 8vw, 52px); line-height: 1; letter-spacing: -0.04em; }
      p { margin: 14px 0 28px; color: var(--muted); font-size: 16px; }
      a {
        min-height: 48px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 12px 24px;
        border-radius: 10px;
        color: white;
        background: var(--navy);
        font-weight: 700;
        text-decoration: none;
        transition: transform 160ms ease, background 160ms ease;
      }
      a:hover { transform: translateY(-2px); background: var(--blue); }
      a:focus-visible { outline: 3px solid rgba(8, 126, 234, 0.35); outline-offset: 4px; }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-9px); }
      }
      @keyframes ripple {
        0% { opacity: 0; transform: scale(0.62); }
        25% { opacity: 1; }
        100% { opacity: 0; transform: scale(1.08); }
      }
      @media (prefers-reduced-motion: reduce) {
        .logo, .logo-stage::before, .logo-stage::after { animation: none; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="logo-stage" aria-hidden="true">
        <img class="logo" src="https://cdn.jsdelivr.net/gh/gkstrmtm/home2smart-assets@main/logo-180.png" alt="" />
      </div>
      <h1>404</h1>
      <p>Page not found.</p>
      <a href="/">Back home</a>
    </main>
  </body>
</html>
