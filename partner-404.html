<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Page not found | Home2Smart Realtor Partners</title>
    <link
      rel="icon"
      href="https://cdn.jsdelivr.net/gh/gkstrmtm/home2smart-assets@main/logo-180.png"
    />
    <style>
      :root {
        color-scheme: light;
        --navy: #10243a;
        --blue: #0e66c8;
        --green: #087a5b;
        --paper: #f8f7f3;
        --line: #d8e0e7;
        --muted: #5d6b78;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        color: var(--navy);
        background:
          radial-gradient(circle at 18% 18%, rgba(14, 102, 200, 0.12), transparent 28rem),
          radial-gradient(circle at 85% 85%, rgba(8, 122, 91, 0.1), transparent 25rem),
          var(--paper);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(100%, 650px);
        padding: clamp(32px, 7vw, 64px);
        text-align: center;
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid var(--line);
        border-radius: 24px;
        box-shadow: 0 24px 70px rgba(16, 36, 58, 0.12);
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 36px;
        color: var(--navy);
        text-align: left;
        font-weight: 800;
        text-decoration: none;
      }

      .brand img { width: 40px; height: 40px; object-fit: contain; }
      .brand small { display: block; margin-top: 2px; color: var(--muted); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; }
      .code { margin: 0 0 12px; color: var(--green); font-size: 13px; font-weight: 800; letter-spacing: 0.15em; text-transform: uppercase; }
      h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(38px, 8vw, 64px); line-height: 1; letter-spacing: -0.035em; }
      p { max-width: 480px; margin: 22px auto 32px; color: var(--muted); font-size: 17px; line-height: 1.65; }

      .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
      .button {
        min-height: 48px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 12px 20px;
        border: 1px solid var(--navy);
        border-radius: 10px;
        color: var(--navy);
        font-weight: 800;
        text-decoration: none;
      }
      .button.primary { color: white; background: var(--navy); }
      .button:hover { transform: translateY(-1px); }
      .button:focus-visible { outline: 3px solid rgba(14, 102, 200, 0.35); outline-offset: 3px; }

      @media (max-width: 480px) {
        main { border-radius: 18px; }
        .actions { display: grid; }
      }
    </style>
  </head>
  <body>
    <main>
      <a class="brand" href="/" aria-label="Home2Smart Realtor Partners home">
        <img src="https://cdn.jsdelivr.net/gh/gkstrmtm/home2smart-assets@main/logo-180.png" alt="" />
        <span>Home2Smart<small>Realtor Partners</small></span>
      </a>
      <div class="code">404 · Page not found</div>
      <h1>This door does not lead anywhere.</h1>
      <p>This page is not part of the partner portal. Return to the program overview or start a partner application.</p>
      <div class="actions">
        <a class="button primary" href="/">Partner program</a>
        <a class="button" href="/apply">Apply to partner</a>
      </div>
    </main>
  </body>
</html>
