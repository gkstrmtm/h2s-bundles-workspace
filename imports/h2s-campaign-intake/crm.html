      async function saveCampaignSettings(){
        const detail = state.campaignDetail;
        const campaign = detail?.campaign;
        if (!campaign) throw new Error('Missing campaign');

        const existingTargeting = campaign.targeting && typeof campaign.targeting === 'object' ? campaign.targeting : {};
        const existingSettings = campaign.settings && typeof campaign.settings === 'object' ? campaign.settings : {};

        const status = String(state.campaignEditor?.status || campaign.status || 'draft').trim();
        const triggers = normalizeCampaignTriggers(
          Array.isArray(state.campaignEditor?.triggers) ? state.campaignEditor.triggers : (Array.isArray(campaign.triggers) ? campaign.triggers : [])
        );
        const tags = Array.isArray(state.campaignEditor?.target_tags) ? state.campaignEditor.target_tags : (Array.isArray(existingTargeting.tags) ? existingTargeting.tags : []);
        const lifecycle_stage = Array.isArray(state.campaignEditor?.lifecycle_stage)
          ? state.campaignEditor.lifecycle_stage
          : (Array.isArray(existingTargeting.lifecycle_stage) ? existingTargeting.lifecycle_stage : []);

        const targeting = {
          ...existingTargeting,
          tags,
          lifecycle_stage
        };

        const settingsText = state.campaignEditor?.settings_text;
        const settings = settingsText != null ? parseJsonText(settingsText) : existingSettings;

        await apiJson('/api/campaigns', 'PATCH', {
          campaign_id: String(campaign.campaign_id),
          patch: {
            status,
            triggers,
            targeting,
            settings
          }
        });

        await loadCampaigns();
        await loadCampaignDetail(String(campaign.campaign_id));

        toast('Saved', 'ok');
      }

      function applySearch(){
        if (state.view === 'contacts') {
          const q = String(dom.search.value || '').trim();
          if (contactSearchTimer) {
            try { clearTimeout(contactSearchTimer); } catch {}
          }
          contactSearchTimer = setTimeout(() => {
            loadContacts(q).catch(showError);
          }, 250);
          return;
        }

        const q = String(dom.search.value || '').trim().toLowerCase();
        if (!q) state.filtered = state.campaigns.slice();
        else state.filtered = state.campaigns.filter((c) => String(c.name || '').toLowerCase().includes(q));
        renderCampaignList();
      }

      async function loadContacts(q = ''){
        dom.campaignList.innerHTML = '';
        dom.campaignList.appendChild(el('div', { class: 'empty', text: 'Loading contacts...' }));
        const qs = String(q || '').trim();
        const url = '/api/contacts?limit=50' + (qs ? ('&q=' + encodeURIComponent(qs)) : '');
        const data = await apiGet(url);
        state.contacts = Array.isArray(data.contacts) ? data.contacts : [];
        // Keep the unmapped inbox fresh in contacts view.
        loadUnmappedSms().catch(() => {});
        renderContactsList();
        if (!state.contacts.length) {
          state.selectedContactId = null;
          state.contactDetail = null;
          renderTimeline();
        }
      }

      async function loadUnmappedSms(){
        if (state.view !== 'contacts') return;
        if (state.isComposingMessage) return;
        try {
          const data = await apiGet('/api/unmapped-sms');
          state.unmappedSmsThreads = Array.isArray(data?.threads) ? data.threads : [];
          // Refresh left list if we're in contacts view.
          if (state.view === 'contacts') renderContactsList();
        } catch {
          // ignore
        }
      }

      async function loadUnmappedSmsThread(phoneDigits){
        const digits = String(phoneDigits || '').replace(/\D/g, '');
        if (!digits) return;
        const data = await apiGet('/api/unmapped-sms?phone=' + encodeURIComponent(digits));
        state.unmappedThreadDetail = data;
        state.timelineRenderOpts = { scrollToBottom: false };
        renderTimeline();
        state.timelineRenderOpts = null;
      }

      async function openCreateContactFromPhoneModal(phoneDigits){
        const digits = String(phoneDigits || '').replace(/\D/g, '');
        const pretty = digits.length === 10
          ? `(${digits.slice(0, 3)}) ${digits.slice(3, 6)}-${digits.slice(6)}`
          : (digits.length === 11 && digits.startsWith('1')
            ? `+1 (${digits.slice(1, 4)}) ${digits.slice(4, 7)}-${digits.slice(7)}`
            : (digits ? ('+' + digits) : ''));

        return new Promise((resolve) => {
          const wrap = el('div', { class: 'stack' }, []);
          const first = el('input', { class: 'input', type: 'text', placeholder: 'First name (optional)' });
          const last = el('input', { class: 'input', type: 'text', placeholder: 'Last name (optional)' });
          const email = el('input', { class: 'input', type: 'email', placeholder: 'Email (optional)' });
          const phone = el('input', { class: 'input', type: 'text', value: pretty || digits, disabled: true });
          wrap.appendChild(el('div', { class: 'help', text: 'Create a contact so this thread becomes searchable + replyable.' }));
          wrap.appendChild(first);
          wrap.appendChild(last);
          wrap.appendChild(email);
          wrap.appendChild(phone);

          let saving = false;
          const m = openModal({
            title: 'Create contact',
            body: wrap,
            closeText: 'Cancel',
            allowOverlayClose: true,
            actions: [
              {
                text: 'Create',
                className: 'btn primary',
                onClick: async () => {

      async function openLoadJourneyTemplateModal(){
        if (state.view !== 'journeys') return;

        // Ensure we have campaigns to choose from.
        if (!Array.isArray(state.campaigns) || !state.campaigns.length) {
          await loadCampaigns();
        }

        const all = Array.isArray(state.campaigns) ? state.campaigns.slice() : [];
        if (!all.length) {
          toast('No journeys available to use as a template', 'warn');
          return;
        }

        function isTemplateLike(c){
          const settings = c?.settings && typeof c.settings === 'object' ? c.settings : {};
          if (settings.is_template === true) return true;
          const name = String(c?.name || '');
          return /template/i.test(name) || /demo/i.test(name);
        }

        const templates = all.filter(isTemplateLike);
        const list = (templates.length ? templates : all)
          .slice()
          .sort((a, b) => String(a?.updated_at || '').localeCompare(String(b?.updated_at || '')))
          .reverse();

        const wrap = el('div', { class: 'stack' }, []);
        wrap.appendChild(el('div', { class: 'help', text: 'Creates a new Journey by copying an existing template/demo journey.' }));

        const sel = document.createElement('select');
        sel.className = 'select';
        sel.appendChild(new Option('Select a template…', ''));
        list.forEach((c) => {
          const name = String(c?.name || '(Untitled)');
          const tag = templates.length ? '' : (isTemplateLike(c) ? ' • TEMPLATE' : '');
          sel.appendChild(new Option(name + tag, String(c.campaign_id)));
        });
        wrap.appendChild(sel);

        let working = false;
        const m = openModal({
          title: 'Load template',
          body: wrap,
          closeText: 'Cancel',
          allowOverlayClose: true,
          actions: [
            {
              text: 'Create from template',
              className: 'btn primary',
              onClick: async () => {
                if (working) return;
                const campaignId = String(sel.value || '').trim();
                if (!campaignId) return toast('Choose a template', 'warn');

                working = true;
                try {
                  const resp = await apiJson('/api/campaigns', 'POST', { action: 'duplicate_campaign', campaign_id: campaignId });
                  const createdId = resp?.campaign?.campaign_id ? String(resp.campaign.campaign_id) : null;
                  toast('Template loaded', 'ok');
                  await loadCampaigns();
                  if (createdId) await selectCampaign(createdId);
                  m.destroy();
                } catch (e) {
                  showError(e);
                } finally {
                  working = false;
                }
              }
            }
          ]
        });
      }

      async function saveStepTemplate(step, tmpl){
        if (state.saving) return;
        state.saving = true;
        renderStepEditor();

        try {
          const detail = state.campaignDetail;
          const campaign = detail?.campaign;
          if (!campaign) throw new Error('Missing campaign');

          let templateSetId = tmpl?.template_set_id ? String(tmpl.template_set_id) : null;

          if (!templateSetId) {
            const setName = (campaign.name || 'Campaign') + ' - Step ' + String(step.step_index || '') + ' (' + state.editor.channel + ')';
            const createdSet = await apiJson('/api/templates', 'POST', {
              action: 'create_set',
              template_set: {
                name: setName,
                kind: 'campaign',
                category: null,
                description: 'Created from crm.html',
                is_active: true
              }
            });
            templateSetId = String(createdSet.template_set.template_set_id);
          }

          const createdVersion = await apiJson('/api/templates', 'POST', {
            action: 'create_version',
            template_set_id: templateSetId,
            version: {
              channel: state.editor.channel,
              subject: state.editor.channel === 'email' ? (state.editor.subject || null) : null,
              text_body: state.editor.text_body || null,
              html_body: (state.editor.channel === 'email' && String(state.editor.html_body || '').trim()) ? state.editor.html_body : null,
              variables: ['first_name'],
              is_active: true
            }
          });

          const newVersionId = String(createdVersion.version.template_version_id);

          const mode = String(state.stepEditor?.schedule_mode || step.schedule_mode || 'relative');
          const patch = {
            channel: state.editor.channel,
            template_version_id: newVersionId,
            schedule_mode: mode,
            is_active: state.stepEditor?.is_active !== undefined ? !!state.stepEditor.is_active : (step.is_active !== false)
          };

          if (mode === 'instant') {
            patch.delay_seconds = null;
            patch.send_at = null;
          } else if (mode === 'relative') {
            const seconds = delayToSeconds(state.stepEditor?.delay_amount ?? 0, state.stepEditor?.delay_unit || 'days');
            if (seconds == null) throw new Error('Invalid delay');
            patch.delay_seconds = seconds;
            patch.send_at = null;
          } else if (mode === 'at_datetime') {
            const localVal = String(state.stepEditor?.send_at_local || '').trim();
            if (!localVal) throw new Error('Send at is required');
            const dt = new Date(localVal);
            if (!Number.isFinite(dt.getTime())) throw new Error('Invalid datetime');
            patch.send_at = dt.toISOString();
            patch.delay_seconds = null;
          }

          if (state.stepEditor?.condition_text !== undefined) {
            patch.condition = parseJsonText(state.stepEditor.condition_text);
          }

          await apiJson('/api/campaigns', 'PATCH', {
            campaign_step_id: String(step.campaign_step_id),
            patch
          });

          clearDraft(String(step.campaign_step_id));
          toast('Saved', 'ok');

          try {
            window.dispatchEvent(
              new CustomEvent('h2s_crm_step_saved', {
                detail: {
                  stepId: String(step.campaign_step_id),
                  campaignId: String(state.selectedCampaignId || ''),
                  savedAt: Date.now()
                }
              })
            );
          } catch {}

          await loadCampaignDetail(state.selectedCampaignId);
          state.selectedStepId = String(step.campaign_step_id);
          renderTimeline();
        } finally {
          state.saving = false;
          renderStepEditor();
        }
      }

      function initWorkspaceResizers(){
        const ws = dom.workspace;
        const r1 = dom.resizerLeftMid;
        const r2 = dom.resizerMidRight;
        if (!ws || !r1 || !r2) return;

        const storageKey = 'h2s_crm_workspace_widths_v1';
        const mq = window.matchMedia('(min-width: 1024px)');

        const clamp = (n, min, max) => Math.max(min, Math.min(max, n));

        function getDefaults(){
          const total = ws.clientWidth || 1280;
          const left = Math.round(total * 0.23);
          const mid = Math.round(total * 0.53);
          const right = Math.max(340, total - left - mid - 24);
          return { left, mid, right };
        }

        function readSaved(){
          try {
            const raw = localStorage.getItem(storageKey);
            if (!raw) return null;
            const parsed = JSON.parse(raw);
            if (!parsed || typeof parsed !== 'object') return null;
            const left = Number(parsed.left);
            const mid = Number(parsed.mid);
            const right = Number(parsed.right);
            if (![left, mid, right].every((v) => Number.isFinite(v) && v > 0)) return null;
            return { left, mid, right };
          } catch {
            return null;
          }
        }

        function writeSaved(sizes){
          try { localStorage.setItem(storageKey, JSON.stringify(sizes)); } catch {}
        }

        function applySizes(raw){
          if (!mq.matches) {
            ws.style.removeProperty('--panel-left');
            ws.style.removeProperty('--panel-mid');
            ws.style.removeProperty('--panel-right');
            return null;
          }

          const total = ws.clientWidth || 1280;
          const minLeft = 260;
          const minMid = 360;
          const minRight = 340;

          let left = Number(raw.left);
          let mid = Number(raw.mid);
          let right = Number(raw.right);

          left = clamp(left, minLeft, total - minMid - minRight);
          mid = clamp(mid, minMid, total - left - minRight);
          right = clamp(right, minRight, total - left - mid);

          const used = left + mid + right;
          if (Math.abs(used - total) > 24) {
            right = clamp(total - left - mid, minRight, total);
          }

          ws.style.setProperty('--panel-left', left + 'px');
          ws.style.setProperty('--panel-mid', mid + 'px');
          ws.style.setProperty('--panel-right', right + 'px');
          return { left, mid, right };
        }

        function reset(){
          const d = getDefaults();
          const applied = applySizes(d);
          if (applied) writeSaved(applied);
        }

        const saved = readSaved();
        const initial = saved || getDefaults();
        const applied = applySizes(initial);
        if (applied && !saved) writeSaved(applied);

        function startDrag(which, e){
          if (!mq.matches) return;
          e.preventDefault();

          const startX = e.clientX;
          const current = readSaved() || applySizes(getDefaults()) || getDefaults();
          const baseLeft = current.left;
          const baseMid = current.mid;
          const baseRight = current.right;

          document.body.classList.add('resizing');

          function onMove(ev){
            const dx = ev.clientX - startX;
            if (which === 'left-mid') {
              const appliedNow = applySizes({ left: baseLeft + dx, mid: baseMid - dx, right: baseRight });
              if (appliedNow) writeSaved(appliedNow);
            } else {
              const appliedNow = applySizes({ left: baseLeft, mid: baseMid + dx, right: baseRight - dx });
              if (appliedNow) writeSaved(appliedNow);
            }
          }

          function onUp(){
            document.body.classList.remove('resizing');
            window.removeEventListener('mousemove', onMove);
            window.removeEventListener('mouseup', onUp);
          }

          window.addEventListener('mousemove', onMove);
          window.addEventListener('mouseup', onUp);
        }

        r1.addEventListener('mousedown', (e) => startDrag('left-mid', e));
        r2.addEventListener('mousedown', (e) => startDrag('mid-right', e));
        r1.addEventListener('dblclick', reset);
        r2.addEventListener('dblclick', reset);

        window.addEventListener('resize', () => {
          const s = readSaved();
          applySizes(s || getDefaults());
        });

        const onMqChange = () => {
          const s = readSaved();
          applySizes(s || getDefaults());
        };

        // Safari < 14 uses addListener/removeListener instead of addEventListener.
        if (typeof mq.addEventListener === 'function') {
          mq.addEventListener('change', onMqChange);
        } else if (typeof mq.addListener === 'function') {
          mq.addListener(onMqChange);
        }
      }

      async function init(){
        if (String(window.location?.protocol || '') === 'file:') {
          document.body.innerHTML = '';
          const wrap = document.createElement('div');
          wrap.style.maxWidth = '920px';

          wrap.style.padding = '18px 18px';
          wrap.style.border = '2px solid #b91c1c';
          wrap.style.borderRadius = '12px';
          wrap.style.background = '#fff1f2';
          wrap.style.fontFamily = 'system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif';
          wrap.innerHTML =
            '<h2 style="margin:0 0 8px 0">CRM must be opened via the local server</h2>' +
            '<div style="margin:0 0 10px 0; line-height:1.35">You opened this page as a local file (<code>file://</code>). In this mode, API calls to <code>/api/*</code> will not work reliably, so SMS/journeys/tests will look broken.</div>' +
            '<div style="margin:0 0 10px 0; line-height:1.35"><b>Fix:</b> run <code>npm run agent:dev</code> and open the <code>/crm</code> URL printed in the terminal (also written to <code>/tmp/h2s-local-dev.log</code>).</div>' +
            '<div style="margin:0; line-height:1.35">Example: <code>http://127.0.0.1:3007/crm</code></div>';
          document.body.appendChild(wrap);
          return;
        }

        loadTheme();

        refreshEnvSubtitle().catch(() => {});

        try {
          initWorkspaceResizers();
        } catch (e) {
          // Never let optional UX (resizers) break core CRM.
        }

        tryBootstrapTokenFromUrl();

        dom.btnAuth.addEventListener('click', () => {
          (async () => {
            const existing = getToken();
            const value = await modalPrompt({
              title: 'Set token',
              text: 'Resource Ops token',
              placeholder: 'Paste token here',
              defaultValue: existing || '',
              inputType: 'password',
              okText: 'Save',
              cancelText: 'Cancel'
            });
            if (value == null) return;
            setToken(value);
            (state.view === 'contacts' ? loadContacts() : loadCampaigns()).catch(showError);
          })().catch(showError);
        });

        dom.btnClearAuth.addEventListener('click', () => {
          clearToken();
          (state.view === 'contacts' ? loadContacts() : loadCampaigns()).catch(showError);
        });

        dom.btnCreate.disabled = false;
        dom.btnCreate.addEventListener('click', () => {
          if (state.view === 'contacts') {
            openAddContactModal().catch(showError);
            return;
          }
          createCampaign().catch(showError);
        });

        dom.btnTemplate.disabled = false;
        dom.btnTemplate.addEventListener('click', () => {
          openLoadJourneyTemplateModal().catch(showError);
        });

        dom.btnSeed.disabled = false;
        dom.btnSeed.addEventListener('click', () => {
          (async () => {
            if (state.view !== 'journeys') return;

            const ok = await modalConfirm({
              title: 'Seed demo journeys?',
              text: 'Creates a few DEMO journeys + templates for testing. Safe to run multiple times (it will not overwrite existing demos).',
              okText: 'Seed demos',
              cancelText: 'Cancel'
            });
            if (!ok) return;

            dom.btnSeed.disabled = true;
            try {
              const result = await apiJson('/api/demo-seed', 'POST', { action: 'seed_demo_journeys' });
              const created = Array.isArray(result?.campaigns)
                ? result.campaigns.filter((c) => c.created).length
                : 0;
              toast(created ? ('Seeded ' + created + ' demo journey' + (created === 1 ? '' : 's')) : 'Demo journeys already exist', 'ok');
              await loadCampaigns();
            } finally {
              dom.btnSeed.disabled = false;
            }
          })().catch(showError);
        });

        dom.btnTheme.addEventListener('click', () => {
          const current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
          setTheme(current === 'dark' ? 'light' : 'dark');
        });

        dom.btnReload.addEventListener('click', () => {
          state.selectedCampaignId = null;
          state.selectedStepId = null;
          state.campaignDetail = null;
          state.selectedContactId = null;
          state.contactDetail = null;
          renderTimeline();
          (state.view === 'contacts' ? loadContacts() : loadCampaigns()).catch(showError);
          refreshEnvSubtitle().catch(() => {});
        });

        dom.search.addEventListener('input', applySearch);

        dom.btnModeJourneys.addEventListener('click', () => setView('journeys'));
        dom.btnModeContacts.addEventListener('click', () => setView('contacts'));

        // Defaults
        dom.btnModeJourneys.className = 'btn primary';
        dom.btnModeContacts.className = 'btn';
        dom.builderToolbar.className = 'toolbar';
        dom.btnCreate.textContent = 'Create blank';
        dom.btnTemplate.className = 'btn';
        dom.btnSeed.className = 'btn';
        dom.search.placeholder = 'Search journeys...';
        dom.timelineHeader.textContent = 'Select a journey';

        renderTimeline();
        await loadCampaigns();
      }

      function renderMissingTokenPanel(){
        dom.campaignList.innerHTML = '';
        const wrap = el('div', { class: 'error' });
        wrap.appendChild(el('div', { text: 'API access requires a token.' }));
        wrap.appendChild(el('div', { class: 'help', text: 'If app auth is enabled on the server, set localStorage.auth_token (Resource Ops token) to access /api/*.' }));
        wrap.appendChild(el('div', { class: 'help', text: 'You can also open this page with ?token=YOUR_TOKEN to auto-set it.' }));

        const input = el('input', { class: 'input', type: 'password', placeholder: 'Paste token here' });
        input.autocomplete = 'off';
        input.spellcheck = false;

        const actions = el('div', { class: 'toolbar' }, []);
        const save = el('button', { class: 'btn primary', type: 'button', text: 'Save token' });
        const cancel = el('button', { class: 'btn', type: 'button', text: 'Cancel' });
        save.addEventListener('click', () => {
          try {
            setToken(input.value);
            loadCampaigns().catch(showError);
          } catch (e) {
            showError(e);
          }
        });
        cancel.addEventListener('click', () => {
          input.value = '';
        });
        actions.appendChild(save);
        actions.appendChild(cancel);

        dom.campaignList.appendChild(wrap);
        dom.campaignList.appendChild(el('div', { style: 'height: 12px' }));
        dom.campaignList.appendChild(input);
        dom.campaignList.appendChild(actions);
      }

      function showError(err){
        const msg = String(err && err.message ? err.message : err);
        const lower = msg.toLowerCase();
        if (
          lower.includes('missing auth token') ||
          lower.includes('missing api key') ||
          lower.includes('invalid api key')
        ) {
          renderMissingTokenPanel();
          dom.timeline.innerHTML = '';
          dom.timeline.appendChild(el('div', { class: 'empty', text: 'Unable to load timeline' }));
          dom.timelineHeader.textContent = 'CRM';
          dom.stepDetails.className = 'empty';
          dom.stepDetails.textContent = 'Select a step to view details';
          return;
        }
        dom.campaignList.innerHTML = '';
        dom.campaignList.appendChild(el('div', { class: 'error', text: msg }));
        dom.timeline.innerHTML = '';
        dom.timeline.appendChild(el('div', { class: 'empty', text: 'Unable to load timeline' }));
        dom.timelineHeader.textContent = 'CRM';
        dom.stepDetails.className = 'empty';
        dom.stepDetails.textContent = 'Select a step to view details';
      }

      init().catch(showError);
  </script>
</body>
</html>
