        if (!state.selectedContactId && state.selectedUnmappedPhone) {
          const t = state.unmappedThreadDetail;
          const digits = String(state.selectedUnmappedPhone || '').trim();
          const title = (t && t.phone_e164_candidates && t.phone_e164_candidates[0])
            ? String(t.phone_e164_candidates[0])
            : (digits ? ('+' + digits) : 'Unknown number');

          dom.timelineHeader.textContent = title;

          const card = el('div', { class: 'card' }, []);
          card.appendChild(
            el('div', { class: 'previewHeader' }, [
              el('div', { class: 'cardTitle', text: 'SMS (unmapped)' }),
              el('span', { class: 'chip warn', text: 'UNMAPPED' })
            ])
          );

          const toolbar = el('div', { class: 'toolbar', style: 'margin-top:8px; gap:8px; justify-content:space-between; flex-wrap:wrap' }, []);
          const hint = el('span', { class: 'muted', text: 'Inbound messages from this number are logged, but not attached to a contact yet.' });
          const btnCreate = el('button', { class: 'btn primary', type: 'button', text: 'Create contact' });
          btnCreate.addEventListener('click', async () => {
            const newId = await openCreateContactFromPhoneModal(digits);
            if (newId) {
              await loadContacts(String(dom.search.value || '').trim());
              await selectContact(String(newId));
            }
          });
          toolbar.appendChild(hint);
          toolbar.appendChild(btnCreate);
          card.appendChild(toolbar);

          const wrap = el('div', { class: 'smsThread' }, []);
          const msgs = Array.isArray(t?.messages) ? t.messages : [];
          if (!msgs.length) {
            wrap.appendChild(el('div', { class: 'empty', text: 'No inbound SMS found yet for this number.' }));
          }

          msgs.forEach((m) => {
            const dir = String(m.direction || 'in');
            const status = String(m.status || '').toLowerCase();

            const row = el('div', { class: 'smsRow ' + (dir === 'in' ? 'in' : 'out') }, []);
            const bubble = el('div', { class: 'smsBubble' }, []);
            bubble.textContent = String(m.text_body || '').trim() || '(No body)';
            if (status === 'failed' || status === 'skipped' || isOverdue(m)) bubble.className += ' failed';
            else if (status === 'queued' || status === 'sending') bubble.className += ' queued';

            const meta = el('div', { class: 'smsMeta', text: smsMetaText(m, dir) }, []);
            if (m.last_error) meta.title = String(m.last_error);

            row.appendChild(el('div', null, [bubble, meta]));
            wrap.appendChild(row);
          });

          card.appendChild(wrap);

          // Keep reader position on refresh.
          try {
            const key = 'unmapped:' + String(state.selectedUnmappedPhone);
            const forceBottom = !!(state.timelineRenderOpts && state.timelineRenderOpts.scrollToBottom);
            const saved = key && state.threadScrollByContactId && state.threadScrollByContactId[key]
              ? state.threadScrollByContactId[key].sms
              : null;

            requestAnimationFrame(() => {
              try {
                if (forceBottom || !saved || saved.nearBottom) wrap.scrollTop = wrap.scrollHeight;
                else wrap.scrollTop = Math.min(Number(saved.scrollTop || 0), wrap.scrollHeight);
              } catch {}
            });
          } catch {}

          dom.timeline.appendChild(card);
          return;
        }

        const detail = state.contactDetail;
        if (!state.selectedContactId || !detail || !detail.contact) {
          dom.timelineHeader.textContent = 'Select a contact';
          dom.timeline.appendChild(el('div', { class: 'empty', text: 'No contact selected' }));
          return;
        }

        dom.timelineHeader.textContent = contactDisplayName(detail.contact);

        const msgs = Array.isArray(detail.messages) ? detail.messages : [];
        const evs = Array.isArray(detail.message_events) ? detail.message_events : [];
        const byOutbox = new Map();
        for (const e of evs) {
          const id = String(e.outbox_id || '');
          if (!id) continue;
          if (!byOutbox.has(id)) byOutbox.set(id, []);
          byOutbox.get(id).push(e);
        }

        function shouldShowDemoSmsThread(contact) {
          // Goal: don’t show demo SMS threads for newly created/real contacts.
          // Keep it for older/demo-ish contacts so existing demo previews remain.
          const attrs = contact?.attributes && typeof contact.attributes === 'object' ? contact.attributes : {};
          if (attrs.demo_sms_thread === true) return true;
          if (attrs.is_demo === true) return true;

          const created = contact?.created_at ? new Date(contact.created_at) : null;
          const createdMs = created && Number.isFinite(created.getTime()) ? created.getTime() : null;
          if (!createdMs) return false;

          // Consider “new” contacts as those created within the last 6 hours.
          // These should show an empty thread, not demo messages.
          const ageMs = Date.now() - createdMs;
          return ageMs > 6 * 60 * 60 * 1000;
        }

        function makeDemoSmsMessages(contact){
          const name = contactDisplayName(contact);
          const now = Date.now();
          const mk = (minsAgo, dir, text, status = 'delivered') => ({
            channel: 'sms',
            direction: dir,
            text_body: text,
            status,
            created_at: new Date(now - minsAgo * 60 * 1000).toISOString(),
            scheduled_at: new Date(now - minsAgo * 60 * 1000).toISOString(),
            __demo: true
          });

          return [
            mk(120, 'in', 'Hi — is this Home2Smart?'),
            mk(119, 'out', 'Yep! This is Home2Smart. Happy to help.'),
            mk(118, 'in', 'Can you tell me more about bundles?'),
            mk(117, 'out', 'Absolutely. Quick question: what city are you in?'),
            mk(116, 'in', 'Austin'),
            mk(115, 'out', 'Thanks ' + name + '. I’ll send options in a minute.')
          ];
        }

        function renderSmsThread(threadMsgs){
          const card = el('div', { class: 'card' }, []);
          const isDemo = (threadMsgs || []).some((m) => m && m.__demo);
          const headerRight = el('div', { class: 'row', style: 'justify-content:flex-end; gap:8px; flex-wrap:wrap' }, [
            el('span', { class: 'chip', text: (isDemo ? 'DEMO' : 'THREAD') })
          ]);
          const header = el('div', { class: 'previewHeader' }, [
            el('div', { class: 'cardTitle', text: 'SMS' }),
            headerRight
          ]);
          card.appendChild(header);

          const overdueSms = (threadMsgs || []).filter((m) => !m.__demo && isOverdue(m));
          if (overdueSms.length) {
            const hint = overdueSms.some((m) => String(m.last_error || '').trim())
              ? 'Some messages failed to send. See error details below.'
              : 'These should have sent already. Dispatcher may not have run yet.';

            const actions = el('div', { class: 'toolbar', style: 'margin-top:8px' }, []);
            const retry = el('button', { class: 'btn warn', type: 'button', text: 'Retry now' });
            retry.addEventListener('click', async () => {
              retry.disabled = true;
              try {
                const d = await dispatchDueNow(25, 30);
                const processedCount = Number(d?.processed_count || (Array.isArray(d?.processed) ? d.processed.length : 0)) || 0;
                const sent = Array.isArray(d?.processed) ? d.processed.filter((x) => x && x.ok && !x.skipped).length : 0;
                const skipped = Array.isArray(d?.processed) ? d.processed.filter((x) => x && x.skipped).length : 0;
                const failed = Array.isArray(d?.processed) ? d.processed.filter((x) => x && x.ok === false).length : 0;
                toast('Dispatch run: ' + sent + ' sent, ' + skipped + ' skipped, ' + failed + ' failed', (failed || skipped) ? 'warn' : 'ok');
                await loadContactDetail(String(detail.contact.contact_id));
              } catch (e) {
                toast('Dispatch failed: ' + String(e?.message || e), 'warn');
              } finally {
                retry.disabled = false;
              }
            });
            actions.appendChild(retry);

            card.appendChild(el('div', { class: 'cardMeta' }, [
              el('span', { class: 'muted', text: 'OVERDUE: ' + overdueSms.length + ' queued • ' + hint })
            ]));
            card.appendChild(actions);
          }

          if (isDemo) {
            card.appendChild(el('div', { class: 'cardMeta' }, [
              el('span', { class: 'muted', text: 'Demo thread (debug). Real messages will replace this once you send SMS.' })
            ]));
          }

          const wrap = el('div', { class: 'smsThread' }, []);
          if (!threadMsgs.length) {
            wrap.appendChild(el('div', { class: 'empty', text: 'No SMS messages yet for this contact.' }));
          }
          threadMsgs.forEach((m) => {
            const dir = String(m.direction || 'out');
            const status = String(m.status || '').toLowerCase();

            const row = el('div', { class: 'smsRow ' + (dir === 'in' ? 'in' : 'out') }, []);
            const bubble = el('div', { class: 'smsBubble' }, []);

            const text = String(m.text_body || '').trim() || '(No body)';
            bubble.textContent = text;
            if (status === 'failed' || status === 'skipped' || (!m.__demo && isOverdue(m))) bubble.className += ' failed';
            else if (status === 'queued' || status === 'sending') bubble.className += ' queued';

            const meta = el('div', { class: 'smsMeta', text: smsMetaText(m, dir) }, []);
            if (!m.__demo && m.last_error) meta.title = String(m.last_error);

            const colChildren = [bubble, meta];
            if (!m.__demo && (status === 'failed' || isOverdue(m)) && m.outbox_id) {
              const actions = el('div', { class: 'toolbar', style: 'margin-top:6px; justify-content: ' + (dir === 'in' ? 'flex-start' : 'flex-end') + ';' }, []);
              const retryOne = el('button', { class: 'btn warn small tinyBtn', type: 'button', text: 'Try again' });
              retryOne.addEventListener('click', async () => {
                retryOne.disabled = true;
                try {
                  if (status === 'failed') {
                    await retryOutboxNow(String(m.outbox_id));
                    toast('Queued retry', 'ok');
                  } else {
                    const d = await dispatchDueNow(25, 30);
                    const sent = Array.isArray(d?.processed) ? d.processed.filter((x) => x && x.ok && !x.skipped).length : Number(d?.processed_count || 0) || 0;
                    const skipped = Array.isArray(d?.processed) ? d.processed.filter((x) => x && x.skipped).length : 0;
                    const failed = Array.isArray(d?.processed) ? d.processed.filter((x) => x && x.ok === false).length : 0;
                    toast('Dispatch run: ' + sent + ' sent, ' + skipped + ' skipped, ' + failed + ' failed', (failed || skipped) ? 'warn' : 'ok');
                  }
                  await loadContactDetail(String(detail.contact.contact_id));
                } catch (e) {
                  toast('Retry failed: ' + String(e?.message || e), 'warn');
                } finally {
                  retryOne.disabled = false;
                }
              });
              actions.appendChild(retryOne);
              colChildren.push(actions);
            }

            const col = el('div', null, colChildren);
            row.appendChild(col);
            wrap.appendChild(row);
          });

          card.appendChild(wrap);

          const contact = detail?.contact || null;
          const canText = !!String(contact?.phone_e164 || '').trim() && contact?.sms_opt_out !== true;
          const composer = el('div', { class: 'smsComposer' }, []);
          const smsInput = el('textarea', {
            class: 'smsComposerInput',
            placeholder: !String(contact?.phone_e164 || '').trim()
              ? 'Add a phone number to send SMS'
              : (contact?.sms_opt_out ? 'SMS disabled (opted out)' : 'Message…'),
            rows: 2
          });

          const contactId = contact?.contact_id ? String(contact.contact_id) : '';
          if (contactId) {
            const existing = state.draftsByContactId && typeof state.draftsByContactId === 'object'
              ? String(state.draftsByContactId[contactId] || '')
              : '';
            if (existing && !smsInput.value) smsInput.value = existing;
          }

          smsInput.disabled = !canText;
          const varSel = makeVariableInsertSelect({ targets: [smsInput] });
          // Keep variable picker out of the composer so it can't overlap the input.
          try { headerRight.insertBefore(varSel, headerRight.firstChild); } catch {}
          const sendBtn = el('button', { class: 'btn primary smsSendBtn', type: 'button', text: 'Send' });
          sendBtn.disabled = !canText;

          function setDraft(value) {
            if (!contactId) return;
            if (!state.draftsByContactId || typeof state.draftsByContactId !== 'object') state.draftsByContactId = {};
            state.draftsByContactId[contactId] = String(value || '');
          }

          async function sendSmsNow(){
            const text = String(smsInput.value || '').trim();
            if (!text) return toast('Type a message', 'warn');
            if (!contact?.contact_id) return toast('Missing contact', 'warn');
            sendBtn.disabled = true;
            smsInput.disabled = true;
            state.isComposingMessage = true;
            try {
              const resp = await apiJson('/api/manual-message', 'POST', {
                contact_id: String(contact.contact_id),
                channel: 'sms',
                text_body: text
              });
              if (!resp?.ok) throw new Error(resp?.error || 'Send failed');
              smsInput.value = '';
              setDraft('');
              toast('SMS sent', 'ok');
              await loadContactDetail(String(contact.contact_id), { force: true, scrollToBottom: true });

              // iMessage feel: snap back to bottom after sending.
              try { wrap.scrollTop = wrap.scrollHeight; } catch {}
            } catch (e) {
              toast('Send failed: ' + String(e?.message || e), 'warn');
            } finally {
              sendBtn.disabled = !canText;
              smsInput.disabled = !canText;
              state.isComposingMessage = false;
              try { smsInput.focus(); } catch {}
            }
          }

          sendBtn.addEventListener('click', sendSmsNow);
          smsInput.addEventListener('keydown', (ev) => {
            // Enter to send, Shift+Enter for newline.
            if (ev.key === 'Enter' && !ev.shiftKey) {
              ev.preventDefault();
              if (!sendBtn.disabled) sendSmsNow();
            }
          });

          smsInput.addEventListener('focus', () => {
            state.isComposingMessage = true;
          });
          smsInput.addEventListener('blur', () => {
            // If there is a draft, keep it; but allow polling again.
            state.isComposingMessage = false;
          });
          smsInput.addEventListener('input', () => {
            state.isComposingMessage = true;
            setDraft(smsInput.value);
          });

          composer.appendChild(smsInput);
          composer.appendChild(sendBtn);
          card.appendChild(composer);

          // Keep reader position on refresh. Auto-scroll only if already near bottom or after sending.
          try {
            const contactIdForScroll = contact?.contact_id ? String(contact.contact_id) : '';
            const forceBottom = !!(state.timelineRenderOpts && state.timelineRenderOpts.scrollToBottom);
            const saved = contactIdForScroll && state.threadScrollByContactId && state.threadScrollByContactId[contactIdForScroll]
              ? state.threadScrollByContactId[contactIdForScroll].sms
              : null;

            requestAnimationFrame(() => {
              try {
                if (forceBottom || !saved || saved.nearBottom) {
                  wrap.scrollTop = wrap.scrollHeight;
                } else {
                  wrap.scrollTop = Math.min(Number(saved.scrollTop || 0), wrap.scrollHeight);
                }
              } catch {}
            });
          } catch {}
          dom.timeline.appendChild(card);
        }

        function renderEmailThread(emailMsgs){
          const card = el('div', { class: 'card' }, []);
          const header = el('div', { class: 'previewHeader' }, [
            el('div', { class: 'cardTitle', text: 'Email' }),
            el('span', { class: 'chip', text: 'THREAD' })
          ]);
          card.appendChild(header);

          const contact = detail?.contact || null;
          const canEmail = !!String(contact?.email || '').trim() && contact?.email_unsubscribed !== true;
          const composer = el('div', { class: 'toolbar emailComposer', style: 'align-items:flex-end; gap:8px; flex-wrap:wrap' }, []);
          const subj = el('input', {
            class: 'input',
            type: 'text',
            placeholder: !String(contact?.email || '').trim()
              ? 'Add an email to send'
              : (contact?.email_unsubscribed ? 'Email disabled (unsubscribed)' : 'Subject'),
            style: 'flex:1; min-width:240px'
          });
          const body = el('textarea', {
            class: 'input',
            placeholder: canEmail ? 'Type an email…' : 'Email not available',
            style: 'min-height:96px; flex:1; min-width:240px; resize:vertical;'
          });

          const contactId = contact?.contact_id ? String(contact.contact_id) : '';
          function setEmailDraft(next) {
            if (!contactId) return;
            if (!state.emailDraftsByContactId || typeof state.emailDraftsByContactId !== 'object') state.emailDraftsByContactId = {};
            state.emailDraftsByContactId[contactId] = {
              subject: String(next?.subject || ''),
              body: String(next?.body || '')
            };
          }

          if (contactId) {
            const existing = state.emailDraftsByContactId && typeof state.emailDraftsByContactId === 'object'
              ? state.emailDraftsByContactId[contactId]
              : null;
            if (existing && typeof existing === 'object') {
              if (!subj.value && existing.subject) subj.value = String(existing.subject);
              if (!body.value && existing.body) body.value = String(existing.body);
            }
          }
          subj.disabled = !canEmail;
          body.disabled = !canEmail;
          const varSel = makeVariableInsertSelect({ targets: [subj, body], placeholder: 'Insert variable…' });
          const sendBtn = el('button', { class: 'btn primary', type: 'button', text: 'Send' });
          sendBtn.disabled = !canEmail;
          sendBtn.addEventListener('click', async () => {
            const subject = String(subj.value || '').trim();
            const text = String(body.value || '').trim();
            if (!subject) return toast('Add a subject', 'warn');
            if (!text) return toast('Type an email body', 'warn');
            sendBtn.disabled = true;
            subj.disabled = true;
            body.disabled = true;
            state.isComposingMessage = true;
            try {
              const resp = await apiJson('/api/manual-message', 'POST', {
                contact_id: String(contact.contact_id),
                channel: 'email',
                subject,
                text_body: text
              });
              if (!resp?.ok) throw new Error(resp?.error || 'Send failed');
              subj.value = '';
              body.value = '';
              setEmailDraft({ subject: '', body: '' });
              toast('Email sent', 'ok');
              await loadContactDetail(String(contact.contact_id), { force: true, scrollToBottom: true });
            } catch (e) {
              toast('Send failed: ' + String(e?.message || e), 'warn');
            } finally {
              sendBtn.disabled = !canEmail;
              subj.disabled = !canEmail;
              body.disabled = !canEmail;
              state.isComposingMessage = false;
            }
          });

          subj.addEventListener('focus', () => { state.isComposingMessage = true; });
          body.addEventListener('focus', () => { state.isComposingMessage = true; });
          subj.addEventListener('blur', () => { state.isComposingMessage = false; });
          body.addEventListener('blur', () => { state.isComposingMessage = false; });

          subj.addEventListener('input', () => {
            state.isComposingMessage = true;
            setEmailDraft({ subject: subj.value, body: body.value });
          });
          body.addEventListener('input', () => {
            state.isComposingMessage = true;
            setEmailDraft({ subject: subj.value, body: body.value });
          });
          composer.appendChild(subj);
          composer.appendChild(body);
          composer.appendChild(varSel);
          composer.appendChild(sendBtn);
          const thread = el('div', { class: 'emailThread' }, []);

          if (!emailMsgs.length) {
            thread.appendChild(el('div', { class: 'empty', text: 'No email messages yet for this contact.' }));
            card.appendChild(thread);
            card.appendChild(composer);
            dom.timeline.appendChild(card);
            return;
          }

          emailMsgs.forEach((m) => {
            const dir = String(m.direction || (m.from_email ? 'in' : 'out'));
            const status = String(m.status || '').toLowerCase();
            const item = el('div', { class: 'emailItem' + (dir === 'in' ? ' inbound' : '') + (status === 'failed' ? ' failed' : '') }, []);

            const left = el('div', null, []);
            const subj = String(m.subject || '').trim() || '(No subject)';
            left.appendChild(el('div', { class: 'emailSubject', text: subj }));

            const body = String(m.text_body || '').trim() || (String(m.html_body || '').trim() ? '(HTML email)' : '(No body)');
            const snippet = body.length > 220 ? body.slice(0, 220) + '…' : body;
            left.appendChild(el('div', { class: 'emailBody', text: snippet }));

            const metaParts = [];
            if (m.created_at) metaParts.push(formatIso(m.created_at));
            if (dir === 'in') {
              metaParts.push('inbound');
              if (m.from_email) metaParts.push('from ' + String(m.from_email));
              if (m.to_email) metaParts.push('to ' + String(m.to_email));
            } else {
              if (m.to_email) metaParts.push('to ' + String(m.to_email));
            }
            if (m.scheduled_at) {
              if (isOverdue(m)) metaParts.push('OVERDUE (was ' + formatIso(m.scheduled_at) + ')');
              else {
                const prefix = status === 'queued' ? 'will send ' : 'scheduled ';
                metaParts.push(prefix + formatIso(m.scheduled_at));
              }
            }
            if (status) metaParts.push(status);
            if (m.provider) metaParts.push(String(m.provider));
            if (m.provider_message_id) metaParts.push('id ' + String(m.provider_message_id));
            if (m.last_error) metaParts.push('error: ' + String(m.last_error));
            if (m.attempts != null) metaParts.push('attempts ' + String(m.attempts));

            const right = el('div', null, []);
            right.appendChild(el('div', { class: 'emailMeta', text: metaParts.join(' • ') }));

            if ((status === 'failed' || isOverdue(m)) && m.outbox_id) {
              const actions = el('div', { class: 'toolbar', style: 'margin-top:8px; justify-content:flex-end' }, []);
              const retryBtn = el('button', { class: 'btn warn small tinyBtn', type: 'button', text: 'Try again' });
              retryBtn.addEventListener('click', async () => {
                retryBtn.disabled = true;
                try {
                  if (status === 'failed') {
                    await retryOutboxNow(String(m.outbox_id));
                    toast('Queued retry', 'ok');
                  } else {
                    const d = await dispatchDueNow(25, 30);
                    const sent = Array.isArray(d?.processed) ? d.processed.filter((x) => x && x.ok && !x.skipped).length : Number(d?.processed_count || 0) || 0;
                    const skipped = Array.isArray(d?.processed) ? d.processed.filter((x) => x && x.skipped).length : 0;
                    const failed = Array.isArray(d?.processed) ? d.processed.filter((x) => x && x.ok === false).length : 0;
                    toast('Dispatch run: ' + sent + ' sent, ' + skipped + ' skipped, ' + failed + ' failed', (failed || skipped) ? 'warn' : 'ok');
                  }
                  await loadContactDetail(String(detail.contact.contact_id));
                } catch (e) {
                  toast('Retry failed: ' + String(e?.message || e), 'warn');
                } finally {
                  retryBtn.disabled = false;
                }
              });
              actions.appendChild(retryBtn);
              right.appendChild(actions);
            }

            item.appendChild(left);
            item.appendChild(right);
            thread.appendChild(item);
          });

          card.appendChild(thread);
          card.appendChild(composer);

          // Keep reader position on refresh. Auto-scroll only if already near bottom or after sending.
          try {
            const contactIdForScroll = contact?.contact_id ? String(contact.contact_id) : '';
            const forceBottom = !!(state.timelineRenderOpts && state.timelineRenderOpts.scrollToBottom);
            const saved = contactIdForScroll && state.threadScrollByContactId && state.threadScrollByContactId[contactIdForScroll]
              ? state.threadScrollByContactId[contactIdForScroll].email
              : null;

            requestAnimationFrame(() => {
              try {
                if (forceBottom || !saved || saved.nearBottom) {
                  thread.scrollTop = thread.scrollHeight;
                } else {
                  thread.scrollTop = Math.min(Number(saved.scrollTop || 0), thread.scrollHeight);
                }
              } catch {}
            });
          } catch {}
          dom.timeline.appendChild(card);
        }

        const smsMsgs = msgs.filter((m) => String(m.channel || '').toLowerCase() === 'sms');
        const emailMsgs = msgs.filter((m) => String(m.channel || '').toLowerCase() === 'email');
        const otherMsgs = msgs.filter((m) => {
          const ch = String(m.channel || '').toLowerCase();
          return ch !== 'sms' && ch !== 'email';
        });

        // DB returns newest-first; render thread oldest-first.
        if (smsMsgs.length) {
          const ordered = smsMsgs
            .slice()
            .reverse()
            .map((m) => ({ ...m, direction: m && m.direction ? String(m.direction) : 'out' }));
          renderSmsThread(ordered);
        } else {
          if (shouldShowDemoSmsThread(detail.contact)) {
            renderSmsThread(makeDemoSmsMessages(detail.contact));
          } else {
            renderSmsThread([]);
          }
        }

        // Email thread (oldest-first)
        if (emailMsgs.length) renderEmailThread(emailMsgs.slice().reverse());
        else renderEmailThread([]);

        otherMsgs.forEach((m) => {
          const ch = String(m.channel || '').toUpperCase() || 'MSG';
          const header = el('div', { class: 'previewHeader' }, [
            el('div', { class: 'cardTitle', text: ch }),
            messageStatusChip(m.status)
          ]);

          const metaParts = [];
          if (m.created_at) metaParts.push('Created ' + formatIso(m.created_at));
          if (m.scheduled_at) {
            if (isOverdue(m)) metaParts.push('OVERDUE (was ' + formatIso(m.scheduled_at) + ')');
            else {
              const prefix = String(m.status || '').toLowerCase() === 'queued' ? 'Will send ' : 'Scheduled ';
              metaParts.push(prefix + formatIso(m.scheduled_at));
            }
          }
          if (m.provider) metaParts.push(String(m.provider));
          if (m.attempts != null) metaParts.push('Attempts ' + String(m.attempts));
          const events = byOutbox.get(String(m.outbox_id || '')) || [];
          if (events.length) {
            const types = Array.from(new Set(events.map((e) => String(e.event_type || '').toLowerCase()).filter(Boolean)));
            if (types.length) metaParts.push('Events: ' + types.join(', '));
          }

          const meta = el('div', { class: 'cardMeta' }, [el('span', { class: 'muted', text: metaParts.join(' • ') })]);

          let body = '';
          if (String(m.channel || '').toLowerCase() === 'email') {
            const subj = String(m.subject || '').trim();
            const txt = String(m.text_body || '').trim();
            body = (subj ? ('Subject: ' + subj + '\n\n') : '') + (txt || '(No body)');
          } else {
            body = String(m.text_body || '').trim() || '(No body)';
          }

          const bubble = el('div', { class: 'previewBubble', text: body });
          const preview = el('div', { class: 'previewBox' }, [header, meta, bubble]);

          const card = el('div', { class: 'card' }, [preview]);

          const status = String(m.status || '').toLowerCase();
          if ((status === 'failed' || isOverdue(m)) && m.outbox_id) {
            const actions = el('div', { class: 'toolbar', style: 'margin-top: 10px' }, []);
            const retryBtn = el('button', { class: 'btn warn', type: 'button', text: 'Try again' });
            retryBtn.addEventListener('click', async () => {
              retryBtn.disabled = true;
              try {
                if (status === 'failed') {
                  await retryOutboxNow(String(m.outbox_id));
                  toast('Queued retry', 'ok');
                } else {
                  const d = await dispatchDueNow(25, 30);
                  const sent = Array.isArray(d?.processed) ? d.processed.filter((x) => x && x.ok && !x.skipped).length : Number(d?.processed_count || 0) || 0;
                  const skipped = Array.isArray(d?.processed) ? d.processed.filter((x) => x && x.skipped).length : 0;
                  const failed = Array.isArray(d?.processed) ? d.processed.filter((x) => x && x.ok === false).length : 0;
                  toast('Dispatch run: ' + sent + ' sent, ' + skipped + ' skipped, ' + failed + ' failed', (failed || skipped) ? 'warn' : 'ok');
                }
                await loadContactDetail(String(detail.contact.contact_id));
              } catch (e) {
                toast('Retry failed: ' + String(e?.message || e), 'warn');
              } finally {
                retryBtn.disabled = false;
              }
            });
            actions.appendChild(retryBtn);
            card.appendChild(actions);
          } else if (isOverdue(m)) {
            const actions = el('div', { class: 'toolbar', style: 'margin-top: 10px' }, []);
            const retryBtn = el('button', { class: 'btn warn', type: 'button', text: 'Retry now' });
            retryBtn.addEventListener('click', async () => {
              retryBtn.disabled = true;
              try {
                const d = await dispatchDueNow(25, 30);
                const processedCount = Number(d?.processed_count || (Array.isArray(d?.processed) ? d.processed.length : 0)) || 0;
                const sent = Array.isArray(d?.processed) ? d.processed.filter((x) => x && x.ok && !x.skipped).length : 0;
                const skipped = Array.isArray(d?.processed) ? d.processed.filter((x) => x && x.skipped).length : 0;
                const failed = Array.isArray(d?.processed) ? d.processed.filter((x) => x && x.ok === false).length : 0;
                toast('Dispatch run: ' + sent + ' sent, ' + skipped + ' skipped, ' + failed + ' failed', (failed || skipped) ? 'warn' : 'ok');
                if (!processedCount) toast('Nothing due to dispatch (still queued)', 'warn');
                await loadContactDetail(String(detail.contact.contact_id));
              } catch (e) {
                toast('Dispatch failed: ' + String(e?.message || e), 'warn');
              } finally {
                retryBtn.disabled = false;
              }
            });
            actions.appendChild(retryBtn);
            card.appendChild(actions);

            if (!m.last_error && (!m.attempts || Number(m.attempts) === 0)) {
              card.appendChild(el('div', { style: 'height: 8px' }));
              card.appendChild(el('div', { class: 'help', text: 'No send attempt recorded yet. Click Retry now to run the dispatcher.' }));
            }
          }

          if (m.last_error) {
            card.appendChild(el('div', { style: 'height: 8px' }));
            card.appendChild(el('div', { class: 'error', text: 'Last error: ' + String(m.last_error) }));
          }

          dom.timeline.appendChild(card);
        });
      }

      function renderRightPanel(){
        if (state.view === 'contacts') {
          renderContactRightPanel();
          return;
        }
        const detail = state.campaignDetail;

        if (!detail || !detail.campaign) {
          dom.stepDetails.className = 'empty';
          dom.stepDetails.textContent = 'Select a journey to view details';
          dom.timelineHeader.textContent = 'Select a journey';
          return;
        }

        if (!state.selectedStepId) {

          dom.timelineHeader.innerHTML = '';
          dom.timelineHeader.appendChild(el('div', { class: 'timelineHeaderTitle', text: detail.campaign.name || 'Journey' }));

          const steps = Array.isArray(detail.steps) ? detail.steps : [];
          const schedulePath = [];
          for (const s of steps) {
            const label = scheduleLabel(s);
            if (!schedulePath.includes(label)) schedulePath.push(label);
          }
          if (schedulePath.length) {
            dom.timelineHeader.appendChild(el('div', { class: 'timelineHeaderMeta', text: schedulePath.join(' → ') }));
          }

          dom.stepDetails.innerHTML = '';
          dom.stepDetails.className = '';

          dom.stepDetails.appendChild(el('div', { class: 'cardTitle', text: detail.campaign.name || 'Journey' }));
          dom.stepDetails.appendChild(el('div', { class: 'help', text: 'This journey is saved. Open Context to assign recipients/tags and begin (queue the start step).' }));

          const actions = el('div', { class: 'toolbar' }, []);
          const ctxBtn = el('button', { class: 'btn primary', type: 'button', text: 'Context / Begin' });
          ctxBtn.addEventListener('click', () => openCampaignSettingsModal().catch(showError));
          actions.appendChild(ctxBtn);

          dom.stepDetails.appendChild(el('div', { class: 'dividerLine' }));
          dom.stepDetails.appendChild(actions);
          return;
        }

        const steps = Array.isArray(detail.steps) ? detail.steps : [];

        dom.timelineHeader.innerHTML = '';
        dom.timelineHeader.appendChild(el('div', { class: 'timelineHeaderTitle', text: detail.campaign.name || 'Journey' }));

        const schedulePath = [];
        for (const s of steps) {
          const label = scheduleLabel(s);
          if (!schedulePath.includes(label)) schedulePath.push(label);
        }
        if (schedulePath.length) {
          dom.timelineHeader.appendChild(el('div', { class: 'timelineHeaderMeta', text: schedulePath.join(' → ') }));
        }

        dom.stepDetails.innerHTML = '';
        dom.stepDetails.className = '';
        renderStepDetails();
        const actions = el('div', { class: 'toolbar' }, []);
        const btn = el('button', { class: 'btn primary', type: 'button', text: 'Edit message' });
        btn.addEventListener('click', () => openStepEditorModal(state.selectedStepId).catch(showError));
        actions.appendChild(btn);

        const ctxBtn = el('button', { class: 'btn', type: 'button', text: 'Context' });
        ctxBtn.addEventListener('click', () => openCampaignSettingsModal().catch(showError));
        actions.appendChild(ctxBtn);

        dom.stepDetails.appendChild(el('div', { class: 'dividerLine' }));
        dom.stepDetails.appendChild(actions);
      }

      function renderContactRightPanel(){
        const detail = state.contactDetail;
        if (!state.selectedContactId || !detail || !detail.contact) {
          dom.stepDetails.className = 'empty';
          dom.stepDetails.textContent = 'Select a contact to view details';
          return;
        }

        const c = detail.contact;
        const metrics = detail.metrics && typeof detail.metrics === 'object' ? detail.metrics : {};
        const valueItemsRaw = Array.isArray(detail.value_items) ? detail.value_items : [];
        state.contactValueExpanded = state.contactValueExpanded && typeof state.contactValueExpanded === 'object' ? state.contactValueExpanded : {};
        dom.stepDetails.innerHTML = '';
        dom.stepDetails.className = '';

        dom.stepDetails.appendChild(el('div', { class: 'cardTitle', text: contactDisplayName(c) }));
        dom.stepDetails.appendChild(el('div', { class: 'help', text: 'Contact profile + message history (outbound).' }));
        dom.stepDetails.appendChild(el('div', { class: 'dividerLine' }));

        const stack = el('div', { class: 'stack' }, []);

        const basics = el('div', { class: 'card' }, []);
        basics.appendChild(el('div', { class: 'cardTitle', text: 'Basics' }));

        const kv = el('div', { class: 'kv' }, []);

        if (c.email) {
          const email = String(c.email || '').trim();
          kv.appendChild(
            el('div', { class: 'kvRow' }, [
              el('div', { class: 'kvKey', text: 'Email' }),
              el('div', { class: 'kvVal' }, [el('a', { class: 'link', href: 'mailto:' + email, text: email }, [])])
            ])
          );
        }

        if (c.phone) {
          const phone = String(c.phone || '').trim();
          kv.appendChild(
            el('div', { class: 'kvRow' }, [
              el('div', { class: 'kvKey', text: 'Phone' }),
              el('div', { class: 'kvVal' }, [
                el('a', { class: 'link', href: 'tel:' + phone, text: phone }, []),
                el('a', { class: 'link', href: 'tel:' + phone, text: 'Call' }, []),
                el('a', { class: 'link', href: 'sms:' + phone, text: 'Text' }, [])
              ])
            ])
          );
        }

        if (c.lifecycle_stage) {
          kv.appendChild(
            el('div', { class: 'kvRow' }, [
              el('div', { class: 'kvKey', text: 'Lifecycle' }),
              el('div', { class: 'kvVal', text: String(c.lifecycle_stage) })
            ])
          );
        }

        if (c.sms_opt_out) {
          kv.appendChild(
            el('div', { class: 'kvRow' }, [
              el('div', { class: 'kvKey', text: 'SMS' }),
              el('div', { class: 'kvVal', text: 'OPT-OUT' })
            ])
          );
        }

        if (c.email_unsubscribed) {
          kv.appendChild(
            el('div', { class: 'kvRow' }, [
              el('div', { class: 'kvKey', text: 'Email' }),
              el('div', { class: 'kvVal', text: 'UNSUBSCRIBED' })
            ])
          );
        }

        if (!kv.childNodes.length) {
          kv.appendChild(el('div', { class: 'help', text: 'No fields' }));
        }

        basics.appendChild(kv);
        stack.appendChild(basics);

        const valueCard = el('div', { class: 'card' }, []);
        valueCard.appendChild(el('div', { class: 'cardTitle', text: 'Value' }));

        function demoValueItems(){
          const seed = String(c.contact_id || '').split('').reduce((sum, ch) => sum + ch.charCodeAt(0), 0);
          const demoCents = 9900 + (seed % 6) * 5000;
          return [
            { kind: 'interest', label: 'Smart thermostat install', source: 'demo', occurred_at: null },
            { kind: 'interest', label: 'Home security cameras', source: 'demo', occurred_at: null },
            { kind: 'purchase', label: 'Starter bundle', quantity: 1, amount_cents: demoCents, source: 'demo', occurred_at: null }
          ];
        }

        const itemsAreDemo = !valueItemsRaw.length;
        const valueItems = valueItemsRaw.length ? valueItemsRaw : demoValueItems();

        const purchases = valueItems.filter((x) => x && x.kind === 'purchase');
        const interests = valueItems.filter((x) => x && x.kind === 'interest');

        const ltvUsd = (typeof metrics.lifetime_value_usd === 'number' && Number.isFinite(metrics.lifetime_value_usd))
          ? metrics.lifetime_value_usd
          : (metrics.lifetime_value_cents == null ? null : (Number(metrics.lifetime_value_cents) / 100));

        const demoLtvUsd = purchases.length
          ? (purchases.reduce((sum, p) => sum + (Number(p.amount_cents || 0) / 100) * (Number(p.quantity || 1) || 1), 0))
          : null;

        const ltvText = ltvUsd == null
          ? (demoLtvUsd == null ? '—' : (formatUsd(demoLtvUsd) + (itemsAreDemo ? ' (demo)' : '')))
          : formatUsd(ltvUsd);

        const expandedKey = String(c.contact_id);
        const expanded = !!state.contactValueExpanded[expandedKey];

        const topRow = el('div', { class: 'toolbar', style: 'margin-top: 8px' }, []);
        const toggleBtn = el('button', { class: 'btn small', type: 'button', text: expanded ? 'Hide details' : 'Show details' });
        toggleBtn.addEventListener('click', () => {
          state.contactValueExpanded[expandedKey] = !state.contactValueExpanded[expandedKey];
          renderRightPanel();
        });

        topRow.appendChild(el('div', { class: 'help', text: itemsAreDemo ? 'No value data yet — showing sample.' : 'Purchases and expressed interest.' }));
        topRow.appendChild(toggleBtn);

        valueCard.appendChild(
          el('div', { class: 'kv' }, [
            el('div', { class: 'kvRow' }, [
              el('div', { class: 'kvKey', text: 'Lifetime value' }),
              el('div', { class: 'kvVal', text: ltvText })
            ])
          ])
        );

        valueCard.appendChild(topRow);

        if (expanded) {
          const list = el('div', { class: 'stack', style: 'margin-top: 10px' }, []);

          function addServiceTag(label){
            return (async () => {
              const name = String(label || '').trim();
              if (!name) return;

              if (c.phone && !c.sms_opt_out && !c.sms_marketing_opt_in) {
                const ok = window.confirm('SMS opt-in is OFF for this contact.\n\nOK = enable SMS opt-in so tag-triggered SMS can send.\nCancel = add tag anyway (SMS may be skipped).');
                if (ok) {
                  await apiJson('/api/contacts', 'PATCH', {
                    contact_id: String(c.contact_id),
                    sms_marketing_opt_in: true,
                    sms_opt_out: false
                  });
                  c.sms_marketing_opt_in = true;
                  c.sms_opt_out = false;
                }
              }

              if (c.email && !c.email_unsubscribed && !c.email_marketing_opt_in) {
                const ok = window.confirm('Email opt-in is OFF for this contact.\n\nOK = enable email opt-in so tag-triggered email can send.\nCancel = add tag anyway (email may be skipped).');
                if (ok) {
                  await apiJson('/api/contacts', 'PATCH', {
                    contact_id: String(c.contact_id),
                    email_marketing_opt_in: true,
                    email_unsubscribed: false
                  });
                  c.email_marketing_opt_in = true;
                  c.email_unsubscribed = false;
                }
              }

              await ensureAllTags();
              let tag = findTagByNameOrKey(`Service: ${name}`) || findTagByNameOrKey(name);
              if (!tag) {
                const created = await apiJson('/api/tags', 'POST', { name: `Service: ${name}` });
                tag = created.tag;
                state.allTags = Array.isArray(state.allTags) ? state.allTags : [];
                if (tag && tag.tag_id) state.allTags.unshift(tag);
              }
              const resp = await apiJson('/api/contact-tags', 'POST', {
                action: 'add',
                contact_id: String(c.contact_id),
                tag_id: String(tag.tag_id)
              });
              state.contactDetail.tags = Array.isArray(resp.tags) ? resp.tags : [];
              toast('Tag added', 'ok');
              try { await dispatchDueNow(25, 30); } catch (_) {}
              renderRightPanel();
            })().catch(showError);
          }

          if (purchases.length) {
            const pc = el('div', { class: 'card' }, []);
            pc.appendChild(el('div', { class: 'cardTitle', text: 'Purchases' }));
            purchases.slice(0, 50).forEach((p) => {
              const label = String(p?.label || 'Purchase');
              const qty = Number(p?.quantity || 1) || 1;
              const amount = p?.amount_cents == null ? null : (Number(p.amount_cents) / 100);
              const right = [];
              if (Number.isFinite(amount)) right.push(formatUsd(amount));
              if (qty !== 1) right.push('x' + String(qty));
              pc.appendChild(
                el('div', { class: 'kvRow' }, [
                  el('div', { class: 'kvKey', text: label }),
                  el('div', { class: 'kvVal', text: right.length ? right.join(' ') : '—' })
                ])
              );
            });
            list.appendChild(pc);
          } else {
            list.appendChild(el('div', { class: 'help', text: 'No purchases yet.' }));
          }

          if (interests.length) {
            const ic = el('div', { class: 'card' }, []);
            ic.appendChild(el('div', { class: 'cardTitle', text: 'Interest' }));
            interests.slice(0, 50).forEach((p) => {
              const label = String(p?.label || 'Interest').trim();
              const row = el('div', { class: 'kvRow' }, [
                el('div', { class: 'kvKey', text: label }),
                el('div', { class: 'kvVal' }, [])
              ]);

              const btn = el('button', { class: 'btn small', type: 'button', text: 'Tag' });
              btn.addEventListener('click', () => addServiceTag(label));
              row.lastChild.appendChild(btn);
              ic.appendChild(row);
            });
            list.appendChild(ic);
          } else {
            list.appendChild(el('div', { class: 'help', text: 'No interest signals yet.' }));
          }

          valueCard.appendChild(list);
        }
        stack.appendChild(valueCard);

        const lifecycleCard = el('div', { class: 'card' }, []);
        lifecycleCard.appendChild(el('div', { class: 'cardTitle', text: 'Lifecycle' }));
        lifecycleCard.appendChild(el('div', { class: 'help', text: 'Manually set the lifecycle stage (persists to DB).' }));

        const stageRow = el('div', { class: 'tagEditorRow' }, []);
        const stageInput = el('input', { class: 'input', type: 'text', placeholder: 'e.g. lead, customer, churned' });
        stageInput.value = String(c.lifecycle_stage || '');
        const stageSave = el('button', { class: 'btn primary small', type: 'button', text: 'Save' });

        stageSave.addEventListener('click', async () => {
          const next = String(stageInput.value || '').trim();
          stageSave.disabled = true;
          try {
            await apiJson('/api/contacts', 'PATCH', {
              contact_id: String(c.contact_id),
              lifecycle_stage: next || null
            });
            toast('Lifecycle stage saved', 'ok');
            await loadContactDetail(String(c.contact_id));
            await loadContacts(String(dom.search.value || '').trim());
          } catch (e) {
            showError(e);
          } finally {
            stageSave.disabled = false;
          }
        });

        stageRow.appendChild(stageInput);
        stageRow.appendChild(stageSave);
        lifecycleCard.appendChild(stageRow);
        stack.appendChild(lifecycleCard);

        const messagingCard = el('div', { class: 'card' }, []);
        messagingCard.appendChild(el('div', { class: 'cardTitle', text: 'Messaging' }));
        messagingCard.appendChild(el('div', { class: 'help', text: 'Controls whether this contact is eligible for sends (opt-in required; opt-out/unsub blocks).' }));

        async function patchContactAndRefresh(nextPatch, okMsg){
          try {
            await apiJson('/api/contacts', 'PATCH', Object.assign({ contact_id: String(c.contact_id) }, nextPatch || {}));
            if (okMsg) toast(okMsg, 'ok');
            await loadContactDetail(String(c.contact_id));
            await loadContacts(String(dom.search.value || '').trim());
          } catch (e) {
            showError(e);
            await loadContactDetail(String(c.contact_id));
          }
        }

        const smsOptIn = document.createElement('input');
        smsOptIn.type = 'checkbox';
        smsOptIn.checked = !!c.sms_marketing_opt_in;
        smsOptIn.disabled = !c.phone;

        const smsOptOut = document.createElement('input');
        smsOptOut.type = 'checkbox';
        smsOptOut.checked = !!c.sms_opt_out;
        smsOptOut.disabled = !c.phone;

        smsOptIn.addEventListener('change', async () => {
          if (smsOptIn.checked) smsOptOut.checked = false;
          await patchContactAndRefresh(
            { sms_marketing_opt_in: !!smsOptIn.checked, sms_opt_out: !!smsOptOut.checked },
            'SMS preferences saved'
          );
        });

        smsOptOut.addEventListener('change', async () => {
          if (smsOptOut.checked) smsOptIn.checked = false;
          await patchContactAndRefresh(
            { sms_marketing_opt_in: !!smsOptIn.checked, sms_opt_out: !!smsOptOut.checked },
            'SMS preferences saved'
          );
        });

        messagingCard.appendChild(el('div', { class: 'checkRow' }, [smsOptIn, el('div', { text: 'SMS marketing opt-in (allows sends)' })]));
        messagingCard.appendChild(el('div', { class: 'checkRow' }, [smsOptOut, el('div', { text: 'SMS opt-out (blocks sends)' })]));

        messagingCard.appendChild(el('div', { class: 'dividerLine' }));

        const emailOptIn = document.createElement('input');
        emailOptIn.type = 'checkbox';
        emailOptIn.checked = !!c.email_marketing_opt_in;
        emailOptIn.disabled = !c.email;

        const emailUnsub = document.createElement('input');
        emailUnsub.type = 'checkbox';
        emailUnsub.checked = !!c.email_unsubscribed;
        emailUnsub.disabled = !c.email;

        emailOptIn.addEventListener('change', async () => {
          if (emailOptIn.checked) emailUnsub.checked = false;
          await patchContactAndRefresh(
            { email_marketing_opt_in: !!emailOptIn.checked, email_unsubscribed: !!emailUnsub.checked },
            'Email preferences saved'
          );
        });

        emailUnsub.addEventListener('change', async () => {
          if (emailUnsub.checked) emailOptIn.checked = false;
          await patchContactAndRefresh(
            { email_marketing_opt_in: !!emailOptIn.checked, email_unsubscribed: !!emailUnsub.checked },
            'Email preferences saved'
          );
        });

        messagingCard.appendChild(el('div', { class: 'checkRow' }, [emailOptIn, el('div', { text: 'Email marketing opt-in (allows sends)' })]));
        messagingCard.appendChild(el('div', { class: 'checkRow' }, [emailUnsub, el('div', { text: 'Email unsubscribed (blocks sends)' })]));

        stack.appendChild(messagingCard);

        const tags = Array.isArray(detail.tags) ? detail.tags : [];
        const tagWrap = el('div', { class: 'card' }, []);
        tagWrap.appendChild(el('div', { class: 'cardTitle', text: 'Tags' }));

        if (!tags.length) {
          tagWrap.appendChild(el('div', { class: 'help', text: 'No tags yet. Add one below.' }));
        } else {
          const row = el('div', { class: 'tagRow' }, []);
          tags.slice(0, 48).forEach((t) => {
            const name = String(t?.name || t?.unique_key || 'tag').trim();
            const chip = el('span', { class: 'tagChip' }, [el('span', { text: name.toUpperCase() })]);
            const btn = el('button', { class: 'tagChipBtn', type: 'button', title: 'Remove tag', text: '×' }, []);
            btn.addEventListener('click', async (ev) => {
              ev.preventDefault();
              ev.stopPropagation();
              try {
                const resp = await apiJson('/api/contact-tags', 'POST', {
                  action: 'remove',
                  contact_id: String(c.contact_id),
                  tag_id: String(t.tag_id)
                });
                state.contactDetail.tags = Array.isArray(resp.tags) ? resp.tags : [];
                renderRightPanel();
                toast('Tag removed', 'ok');
              } catch (e) {
                showError(e);
              }
            });
            chip.appendChild(btn);
            row.appendChild(chip);
          });
          tagWrap.appendChild(row);
        }

        const editor = el('div', { class: 'tagEditorRow' }, []);
        const input = el('input', { class: 'input', type: 'text', placeholder: 'Add tag (select or type a new one)…' });
        const listId = 'tag-options-' + String(c.contact_id || 'x');
        input.setAttribute('list', listId);

        const dl = el('datalist', { id: listId }, []);
        (Array.isArray(state.allTags) ? state.allTags : []).slice(0, 500).forEach((t) => {
          dl.appendChild(el('option', { value: String(t.name || t.unique_key || '').trim() }, []));
        });

        const addBtn = el('button', { class: 'btn primary small', type: 'button', text: 'Add' });
        addBtn.addEventListener('click', async () => {
          const name = String(input.value || '').trim();
          if (!name) return;
          addBtn.disabled = true;
          try {
            if (c.phone && !c.sms_opt_out && !c.sms_marketing_opt_in) {
              const ok = window.confirm('SMS opt-in is OFF for this contact.\n\nOK = enable SMS opt-in so tag-triggered SMS can send.\nCancel = add tag anyway (SMS may be skipped).');
              if (ok) {
                await apiJson('/api/contacts', 'PATCH', {
                  contact_id: String(c.contact_id),
                  sms_marketing_opt_in: true,
                  sms_opt_out: false
                });
                c.sms_marketing_opt_in = true;
                c.sms_opt_out = false;
              }
            }

            if (c.email && !c.email_unsubscribed && !c.email_marketing_opt_in) {
              const ok = window.confirm('Email opt-in is OFF for this contact.\n\nOK = enable email opt-in so tag-triggered email can send.\nCancel = add tag anyway (email may be skipped).');
              if (ok) {
                await apiJson('/api/contacts', 'PATCH', {
                  contact_id: String(c.contact_id),
                  email_marketing_opt_in: true,
                  email_unsubscribed: false
                });
                c.email_marketing_opt_in = true;
                c.email_unsubscribed = false;
              }
            }

            await ensureAllTags();

            let tag = findTagByNameOrKey(name);
            if (!tag) {
              const created = await apiJson('/api/tags', 'POST', { name });
              tag = created.tag;
              state.allTags = Array.isArray(state.allTags) ? state.allTags : [];
              if (tag && tag.tag_id) state.allTags.unshift(tag);
            }

            const resp = await apiJson('/api/contact-tags', 'POST', {
              action: 'add',
              contact_id: String(c.contact_id),
              tag_id: String(tag.tag_id)
            });

            state.contactDetail.tags = Array.isArray(resp.tags) ? resp.tags : [];
            input.value = '';
            renderRightPanel();
            toast('Tag added', 'ok');
            try { await dispatchDueNow(25, 30); } catch (_) {}
            await loadContactDetail(String(c.contact_id));
          } catch (e) {
            showError(e);
          } finally {
            addBtn.disabled = false;
          }
        });

        input.addEventListener('keydown', (ev) => {
          if (ev.key === 'Enter') {
            ev.preventDefault();
            addBtn.click();
          }
        });

        editor.appendChild(input);
        editor.appendChild(addBtn);
        tagWrap.appendChild(editor);
        tagWrap.appendChild(dl);
        stack.appendChild(tagWrap);

        // Variables (global definitions + per-contact values)
        const attrs = c.attributes && typeof c.attributes === 'object' ? c.attributes : {};
        const customVarsRaw = attrs.custom_vars && typeof attrs.custom_vars === 'object' ? attrs.custom_vars : {};

        const varsCard = el('div', { class: 'card' }, []);
        varsCard.appendChild(el('div', { class: 'cardTitle', text: 'Variables' }));
        varsCard.appendChild(el('div', { class: 'help', text: 'Define variables once (key + meaning). Then set a value per contact. Use in messages like {first_name}.' }));

        if (!Array.isArray(state.variableDefs)) {
          varsCard.appendChild(el('div', { class: 'help', text: 'Loading variables…' }));
          ensureVariableDefs().then(() => renderRightPanel()).catch(() => {});
        } else {
          const defs = state.variableDefs;
          const defKeys = defs.map((d) => String(d?.key || '').trim()).filter(Boolean);

          function renderVarRow(key, meaning){
            const row = el('div', { class: 'varEditorRow' }, []);
            row.style.alignItems = 'center';

            const keyBox = el('div', { class: 'help varKeyBox', text: String(key) + '  {' + String(key) + '}' });

            const meaningBox = el('div', { class: 'muted varMeaningBox', text: meaning ? String(meaning) : '—' });

            const valInput = el('input', { class: 'input varValueInput', type: 'text', placeholder: 'Value for this contact' });
            valInput.value = customVarsRaw[key] == null ? '' : String(customVarsRaw[key]);

            const saveBtn = el('button', { class: 'btn primary small', type: 'button', text: 'Save' });
            const clearBtn = el('button', { class: 'btn small', type: 'button', text: 'Clear' });
            const editBtn = el('button', { class: 'btn small', type: 'button', text: 'Edit meaning' });
            const delDefBtn = el('button', { class: 'btn warn small', type: 'button', text: 'Delete var' });

            saveBtn.addEventListener('click', async () => {
              saveBtn.disabled = true;
              try {
                const resp = await apiJson('/api/contact-variables', 'POST', {
                  contact_id: String(c.contact_id),
                  key: String(key),
                  value: String(valInput.value || '')
                });
                c.attributes = c.attributes && typeof c.attributes === 'object' ? c.attributes : {};
                c.attributes.custom_vars = resp.custom_vars || {};
                toast('Saved', 'ok');
              } catch (e) {
                showError(e);
              } finally {
                saveBtn.disabled = false;
              }
            });

            clearBtn.addEventListener('click', async () => {
              clearBtn.disabled = true;
              try {
                const resp = await apiJson('/api/contact-variables', 'DELETE', {
                  contact_id: String(c.contact_id),
                  key: String(key)
                });
                c.attributes = c.attributes && typeof c.attributes === 'object' ? c.attributes : {};
                c.attributes.custom_vars = resp.custom_vars || {};
                toast('Cleared', 'ok');
                valInput.value = '';
              } catch (e) {
                showError(e);
              } finally {
                clearBtn.disabled = false;
              }
            });

            editBtn.addEventListener('click', async () => {
              const next = window.prompt('Meaning for ' + String(key) + ':', String(meaning || ''));
              if (next == null) return;
              editBtn.disabled = true;
              try {
                await apiJson('/api/variable-defs', 'POST', { key: String(key), meaning: String(next || '') });
                state.variableDefs = null;
                await ensureVariableDefs();
                toast('Meaning saved', 'ok');
                renderRightPanel();
              } catch (e) {
                showError(e);
              } finally {
                editBtn.disabled = false;
              }
            });

            delDefBtn.addEventListener('click', async () => {
              const ok = window.confirm('Delete variable definition {' + String(key) + '} for everyone?');
              if (!ok) return;
              delDefBtn.disabled = true;
              try {
                await apiJson('/api/variable-defs', 'DELETE', { key: String(key) });
                state.variableDefs = null;
                await ensureVariableDefs();
                toast('Variable deleted', 'ok');
                renderRightPanel();
              } catch (e) {
                showError(e);
              } finally {
                delDefBtn.disabled = false;
              }
            });

            row.appendChild(keyBox);
            row.appendChild(meaningBox);
            row.appendChild(valInput);
            row.appendChild(saveBtn);
            row.appendChild(clearBtn);
            row.appendChild(editBtn);
            row.appendChild(delDefBtn);
            return row;
          }

          if (!defs.length) {
            varsCard.appendChild(el('div', { class: 'help', text: 'No variables defined yet. Add one below.' }));
          } else {
            defs.slice(0, 100).forEach((d) => {
              const key = String(d?.key || '').trim();
              if (!key) return;
              const meaning = String(d?.meaning || '').trim();
              varsCard.appendChild(renderVarRow(key, meaning));
            });
          }

          // Show any contact variables that don't have a global definition yet.
          const extraKeys = Object.keys(customVarsRaw || {}).filter((k) => !defKeys.includes(String(k)));
          if (extraKeys.length) {
            varsCard.appendChild(el('div', { class: 'dividerLine' }));
            varsCard.appendChild(el('div', { class: 'help', text: 'Other variables on this contact (not defined globally yet):' }));
            extraKeys.slice(0, 30).sort().forEach((k) => {
              varsCard.appendChild(renderVarRow(String(k), ''));
            });
          }

          varsCard.appendChild(el('div', { class: 'dividerLine' }));
          varsCard.appendChild(el('div', { class: 'help', text: 'Add a new variable definition (available for all contacts):' }));

          const addDefRow = el('div', { class: 'varEditorRow' }, []);
          const keyInput = el('input', { class: 'input', type: 'text', placeholder: 'Key (e.g. project_type)' });
          keyInput.style.minWidth = '170px';
          keyInput.style.flex = '0 0 auto';
          const meaningInput = el('input', { class: 'input', type: 'text', placeholder: 'Meaning (shown in dropdown)' });
          const valueInput = el('input', { class: 'input varValueInput', type: 'text', placeholder: 'Value for this contact (optional)' });
          const addBtn = el('button', { class: 'btn primary small', type: 'button', text: 'Create' });

          async function addDef(){
            const kRaw = String(keyInput.value || '').trim();
            const mRaw = String(meaningInput.value || '').trim();
            const vRaw = String(valueInput.value || '');
            if (!kRaw) return toast('Enter a key', 'warn');
            addBtn.disabled = true;
            try {
              const resp = await apiJson('/api/variable-defs', 'POST', { key: kRaw, meaning: mRaw });
              const savedKey = String(resp?.def?.key || resp?.key || '').trim();
              state.variableDefs = null;
              await ensureVariableDefs();

              if (savedKey && String(vRaw || '').trim() !== '') {
                const r2 = await apiJson('/api/contact-variables', 'POST', {
                  contact_id: String(c.contact_id),
                  key: savedKey,
                  value: vRaw
                });
                c.attributes = c.attributes && typeof c.attributes === 'object' ? c.attributes : {};
                c.attributes.custom_vars = r2.custom_vars || {};
              }

              keyInput.value = '';
              meaningInput.value = '';
              valueInput.value = '';
              toast('Variable created' + (savedKey ? (': {' + savedKey + '}') : ''), 'ok');
              renderRightPanel();
            } catch (e) {
              showError(e);
            } finally {
              addBtn.disabled = false;
            }
          }

          addBtn.addEventListener('click', addDef);
          keyInput.addEventListener('keydown', (ev) => {
            if (ev.key === 'Enter') { ev.preventDefault(); addDef(); }
          });
          meaningInput.addEventListener('keydown', (ev) => {
            if (ev.key === 'Enter') { ev.preventDefault(); addDef(); }
          });
          valueInput.addEventListener('keydown', (ev) => {
            if (ev.key === 'Enter') { ev.preventDefault(); addDef(); }
          });

          addDefRow.appendChild(keyInput);
          addDefRow.appendChild(meaningInput);
          addDefRow.appendChild(valueInput);
          addDefRow.appendChild(addBtn);
          varsCard.appendChild(addDefRow);
        }

        stack.appendChild(varsCard);

        const journeys = el('div', { class: 'card' }, []);
        journeys.appendChild(el('div', { class: 'cardTitle', text: 'Journeys' }));
        journeys.appendChild(el('div', { class: 'help', text: 'Manually enroll this contact and queue step 1 (useful for instant steps).' }));

        const journeyRow = el('div', { class: 'tagEditorRow' }, []);
        const select = el('select', { class: 'input' }, []);
        select.appendChild(el('option', { value: '', text: 'Select a journey…' }, []));

        const beginBtn = el('button', { class: 'btn primary small', type: 'button', text: 'Begin' });
        beginBtn.disabled = true;

        async function refreshCampaignOptions(){
          await ensureCampaignIndex();
          const campaigns = (Array.isArray(state.campaigns) ? state.campaigns : []).filter((x) => String(x.status || '') === 'active');
          select.innerHTML = '';
          select.appendChild(el('option', { value: '', text: campaigns.length ? 'Select a journey…' : 'No active journeys found' }, []));
          campaigns
            .slice()
            .sort((a, b) => String(a.name || '').localeCompare(String(b.name || '')))
            .slice(0, 200)
            .forEach((camp) => {
              select.appendChild(el('option', { value: String(camp.campaign_id), text: String(camp.name || 'Untitled journey') }, []));
            });

          beginBtn.disabled = !select.value;
        }

        select.addEventListener('change', () => {
          beginBtn.disabled = !select.value;
        });

        beginBtn.addEventListener('click', async () => {
          const campaignId = String(select.value || '').trim();
          if (!campaignId) return;
          beginBtn.disabled = true;
          try {
            // If a journey's first step is SMS/email, the dispatcher will enforce opt-in.
            // Prompt here so "Begin" actually results in sends during testing.
            if (c.phone && !c.sms_opt_out && !c.sms_marketing_opt_in) {
              const ok = window.confirm('SMS opt-in is OFF for this contact.\n\nOK = enable SMS opt-in and continue.\nCancel = do not enroll/send.');
              if (!ok) {
                toast('SMS opt-in required to send', 'warn');
                return;
              }
              await apiJson('/api/contacts', 'PATCH', {
                contact_id: String(c.contact_id),
                sms_marketing_opt_in: true,
                sms_opt_out: false
              });
              c.sms_marketing_opt_in = true;
              c.sms_opt_out = false;
            }

            if (c.email && !c.email_unsubscribed && !c.email_marketing_opt_in) {
              const ok = window.confirm('Email opt-in is OFF for this contact.\n\nOK = enable email opt-in and continue.\nCancel = do not enroll/send.');
              if (!ok) {
                toast('Email opt-in required to send', 'warn');
                return;
              }
              await apiJson('/api/contacts', 'PATCH', {
                contact_id: String(c.contact_id),
                email_marketing_opt_in: true,
                email_unsubscribed: false
              });
              c.email_marketing_opt_in = true;
              c.email_unsubscribed = false;
            }

            const resp = await apiJson('/api/begin-journey', 'POST', {
              campaign_id: campaignId,
              contact_id: String(c.contact_id),
              mode: 'restart'
            });

            const first = Array.isArray(resp?.results) ? resp.results[0] : null;

            // Try to send immediately (otherwise it stays queued until cron runs).
            try {
              const d = await dispatchDueNow(10, 10);
              const processedCount = Number(d?.processed_count || (Array.isArray(d?.processed) ? d.processed.length : 0)) || 0;
              const sent = Array.isArray(d?.processed) ? d.processed.filter((x) => x && x.ok && !x.skipped).length : 0;
              const skipped = Array.isArray(d?.processed) ? d.processed.filter((x) => x && x.skipped).length : 0;
              const failed = Array.isArray(d?.processed) ? d.processed.filter((x) => x && x.ok === false).length : 0;
              if (processedCount) toast('Dispatch run: ' + sent + ' sent, ' + skipped + ' skipped, ' + failed + ' failed', (failed || skipped) ? 'warn' : 'ok');
            } catch (e) {
              toast('Queued (dispatch failed): ' + String(e?.message || e), 'warn');
            }

            if (first?.restarted) toast('Re-enrolled (queued a fresh start step)', 'ok');
            else if (first?.scheduled_at) toast('Journey started (scheduled ' + formatIso(first.scheduled_at) + ')', 'ok');
            else toast('Journey started', 'ok');

            await loadContactDetail(String(c.contact_id));
          } catch (e) {
            showError(e);
          } finally {
            beginBtn.disabled = !select.value;
          }
        });

        journeyRow.appendChild(select);
        journeyRow.appendChild(beginBtn);
        journeys.appendChild(journeyRow);

        // Existing enrollments
        const enrollments = Array.isArray(detail.enrollments) ? detail.enrollments : [];
        const active = enrollments.filter((e) => String(e?.status || '').toLowerCase() === 'active');
        const stopped = enrollments.filter((e) => String(e?.status || '').toLowerCase() === 'stopped');

        const enrollWrap = el('div', { style: 'margin-top: 10px' }, []);
        enrollWrap.appendChild(el('div', { class: 'help', text: active.length ? 'Active enrollments' : 'No active enrollments.' }));

        function campName(e){
          return String(e?.crm_campaigns?.name || e?.campaign_name || e?.campaign_id || 'Journey');
        }

        active.slice(0, 20).forEach((e) => {
          const row = el('div', { class: 'toolbar', style: 'margin-top: 6px; justify-content: space-between' }, []);
          row.appendChild(el('div', { class: 'muted', text: campName(e) + ' • enrolled ' + (e.enrolled_at ? formatIso(e.enrolled_at) : '—') }, []));

          const stopBtn = el('button', { class: 'btn warn small', type: 'button', text: 'Stop' });
          stopBtn.addEventListener('click', async () => {
            stopBtn.disabled = true;
            try {
              await apiJson('/api/enrollments', 'POST', { action: 'stop', enrollment_id: String(e.enrollment_id) });
              toast('Enrollment stopped', 'ok');
              await loadContactDetail(String(c.contact_id));
            } catch (err) {
              showError(err);
            } finally {
              stopBtn.disabled = false;
            }
          });
          row.appendChild(stopBtn);
          enrollWrap.appendChild(row);
        });

        if (stopped.length) {
          enrollWrap.appendChild(el('div', { class: 'help', text: 'Stopped (' + String(stopped.length) + ')' }));
        }

        journeys.appendChild(enrollWrap);
        stack.appendChild(journeys);

        refreshCampaignOptions().catch(() => {});

        dom.stepDetails.appendChild(stack);
      }

      function renderCampaignSettings(){
        const campaign = state.campaignDetail?.campaign;
        if (!campaign) {
          dom.stepDetails.className = 'empty';
          dom.stepDetails.textContent = 'Select a campaign to view details';
          return;
        }

        const triggers = normalizeCampaignTriggers(campaign.triggers);
        const targeting = campaign.targeting && typeof campaign.targeting === 'object' ? campaign.targeting : {};
        const settings = campaign.settings && typeof campaign.settings === 'object' ? campaign.settings : {};

        state.campaignEditor = state.campaignEditor || {};
        state.campaignEditor.status = state.campaignEditor.status ?? String(campaign.status || 'draft');
        state.campaignEditor.triggers = normalizeCampaignTriggers(state.campaignEditor.triggers ?? triggers.slice());
        state.campaignEditor.target_tags = state.campaignEditor.target_tags ?? (Array.isArray(targeting.tags) ? targeting.tags.slice() : []);
        state.campaignEditor.lifecycle_stage = state.campaignEditor.lifecycle_stage ?? (Array.isArray(targeting.lifecycle_stage) ? targeting.lifecycle_stage.slice() : []);
        state.campaignEditor.settings_text = state.campaignEditor.settings_text ?? tryPrettyJson(settings);

        dom.stepDetails.innerHTML = '';
        dom.stepDetails.className = '';

        dom.stepDetails.appendChild(el('div', { class: 'cardTitle', text: campaign.name || 'Campaign' }));
        dom.stepDetails.appendChild(el('div', { class: 'help', text: 'Campaign-level settings (status, triggers, targeting, settings).' }));
        dom.stepDetails.appendChild(el('div', { class: 'dividerLine' }));

        const stack = el('div', { class: 'stack' }, []);

        // Manual begin (useful for instant steps)
        const beginCard = el('div', { class: 'card' }, []);
        beginCard.appendChild(el('div', { class: 'cardTitle', text: 'Begin / Trigger' }));
        beginCard.appendChild(el('div', { class: 'help', text: 'Add recipients by name or tag, then begin to enroll + queue the start step.' }));

        const recipients = [];

        const recipientsWrap = el('div', { class: 'tagRow', style: 'margin-top: 10px' }, []);
        beginCard.appendChild(recipientsWrap);

        function syncBeginEnabled(btn){
          btn.disabled = recipients.length === 0;
        }

        function recipientLabel(c){
          const parts = [contactDisplayName(c)];
          if (c.email) parts.push(String(c.email));
          else if (c.phone) parts.push(String(c.phone));
          return parts.join(' — ');
        }

        function renderRecipients(){
          recipientsWrap.innerHTML = '';
          if (!recipients.length) {
            recipientsWrap.appendChild(el('div', { class: 'help', text: 'No recipients added yet.' }));
            return;
          }

          recipients.slice(0, 200).forEach((c) => {
            const name = recipientLabel(c);
            const chip = el('span', { class: 'tagChip' }, [el('span', { text: name })]);
            const btn = el('button', { class: 'tagChipBtn', type: 'button', title: 'Remove recipient', text: '×' }, []);
            btn.addEventListener('click', () => {
              const idx = recipients.findIndex((x) => String(x.contact_id) === String(c.contact_id));
              if (idx >= 0) recipients.splice(idx, 1);
              renderRecipients();
              syncBeginEnabled(beginBtn);
            });
            chip.appendChild(btn);
            recipientsWrap.appendChild(chip);
          });
        }

        function addRecipient(c){
