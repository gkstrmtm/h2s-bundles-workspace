<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Home2Smart sales review</title>
<style>
body{margin:0;height:100dvh;overflow:hidden;overflow-x:auto;display:flex;flex-direction:column;background:#f5f5f5;font:12px/1.5 system-ui,sans-serif;color:#262626}
header{flex:none;padding:8px 12px;border-bottom:1px solid #d4d4d4;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:white}
label{margin-left:auto}select{font:inherit;padding:4px}iframe{display:block;flex:1;width:min(100%,var(--review-width,390px));max-width:100%;height:0;min-height:0;border:0;margin:auto;background:white}
[role=alert]{padding:12px;color:#b91c1c}
</style></head>
<body><header><strong id="title">Sales preview</strong><span>ISOLATED SYNTHETIC DATA · No production or real money</span>
<label>Maximum width <select id="width" aria-label="Preview width"><option>320</option><option>390</option><option>768</option><option>1024</option><option>1280</option><option>1440</option></select></label></header>
<p id="error" role="alert" hidden></p><iframe id="application" title="Actual Home2Smart application"></iframe>
<script>
(async()=>{
    const screen=new URLSearchParams(location.search).get('screen')||'home';
    const screens={home:['Salesperson Home','home'],leads:['Leads & New Prospect','new'],assessment:['Service Selection & Assessment','assessment'],
        quotes:['Quote Builder','quotes'],orders:['Orders & Customer Status','orders'],earnings:['Personal Earnings','earnings'],
        management:['Management Sales Overview','performance'],managementOrders:['Management Orders & Customer Details','orders'],
        managementQuotes:['Management Quotes & Payments','transactions'],commissions:['Management Commissions & Friday Review','commissions'],
        adminDashboard:['Admin Dashboard'],websiteMedia:['Website Media'],customerQueue:['Customer Queue'],operations:['Operations']};
    const dashboardTabs={adminDashboard:'admin',websiteMedia:'proofpacks',customerQueue:'commercialqueue',operations:'operations'};
    const [label,view]=screens[screen]||screens.home,admin=['management','managementOrders','managementQuotes','commissions'].includes(screen)||Object.hasOwn(dashboardTabs,screen),frame=document.getElementById('application');
    document.title=label+' · Home2Smart Local';document.getElementById('title').textContent=label;
    const width=document.getElementById('width');width.value=admin?'1280':'390';
    const resize=()=>document.documentElement.style.setProperty('--review-width',width.value+'px');width.onchange=resize;resize();
    const response=await fetch('/walkthrough/status'),state=await response.json();
    if(!response.ok||!state.gallery)throw Error('This server has no prepared sales review data.');
    const url=new URL(admin?'/dash.html':'/sales.html',location.origin);
    url.searchParams.set('reviewRole',admin?'ADMIN':'SALES');url.searchParams.set('reviewNavigation','1');
    if(admin)url.searchParams.set('reviewTab',dashboardTabs[screen]||'fieldsales');else url.searchParams.set('view',view);
    if(screen==='assessment')url.searchParams.set('lead',state.gallery.assessmentLeadId);
    if(screen==='quotes')url.searchParams.set('lead',state.gallery.quoteLeadId);
    addEventListener('message',event=>{
        if(event.source!==frame.contentWindow||event.origin!==location.origin)return;
        if(admin&&view&&event.data?.type==='h2s-review-ready')frame.contentWindow.postMessage({type:'h2s-review-position',mode:view,navigationVersion:1,documentVersion:1},location.origin);
        if(event.data?.type==='h2s-review-navigation'){
            const target=new URL(event.data.url,location.origin);
            if(target.origin!==location.origin){const error=document.getElementById('error');error.hidden=false;error.textContent='External navigation blocked.';return;}
            target.searchParams.set('reviewNavigation','1');frame.src=target.href;
        }
    });
    frame.src=url.href;
})().catch(error=>{const el=document.getElementById('error');el.hidden=false;el.textContent=error.message;console.error(error);});
</script></body></html>
